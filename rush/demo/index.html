<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a2350">
<title>Delivery Rush · Demo</title>
<script>
['gesturestart','gesturechange','gestureend'].forEach(e => document.addEventListener(e, x => x.preventDefault(), { passive: false }));
document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && /^(Equal|Minus|NumpadAdd|NumpadSubtract|Digit0)$/.test(e.code)) e.preventDefault(); });
</script>
<style>
@font-face{font-family:Mont;font-weight:700 900;src:url(/rush/demo/mont-700.woff2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#d7e6ef;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;font-family:Mont,system-ui,sans-serif;color:#fff}
canvas{display:block;position:fixed;inset:0}
.ui{position:fixed;inset:0;pointer-events:none;z-index:5}
.t{font-weight:900;text-shadow:0 3px 0 rgba(34,26,72,.9),2px 0 0 #221a48,-2px 0 0 #221a48,0 -2px 0 #221a48,2px 2px 0 #221a48,-2px 2px 0 #221a48,2px -2px 0 #221a48,-2px -2px 0 #221a48}
button{font:inherit;cursor:pointer;border:0;pointer-events:auto}
/* ---------- HUD ---------- */
#hud{display:none}body.play #hud,body.paused #hud,body.over #hud{display:block}
.top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;align-items:flex-start;justify-content:space-between}
#pauseBtn{width:46px;height:46px;border-radius:14px;background:linear-gradient(#6aa8e0,#3d73c2);box-shadow:0 4px 0 #2a4f8a,inset 0 2px 0 rgba(255,255,255,.5);display:grid;place-items:center}
#pauseBtn::before{content:"";width:16px;height:18px;border-left:6px solid #fff;border-right:6px solid #fff}
.sbox{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.row{display:flex;align-items:center;gap:7px;background:rgba(30,24,64,.5);border-radius:14px;padding:3px 12px 3px 4px}
#mul{font-size:17px;background:linear-gradient(#ffd86a,#e8a320);color:#5a3200;border-radius:10px;padding:2px 8px;text-shadow:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
#mul.hot{background:linear-gradient(#ff8ac7,#d9478f);color:#fff;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
#sc{font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ci{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff6b8,#ffcf3a 55%,#e09a10);box-shadow:inset 0 0 0 2px #d18810;display:inline-grid;place-items:center;color:#c47a00;font-size:14px;text-shadow:0 1px 0 #fff2b0;vertical-align:middle}
#cn{font-size:22px}
#pw{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom) + 96px);display:flex;flex-direction:column;gap:7px}
.pwr{display:flex;align-items:center;gap:7px;background:rgba(30,24,64,.55);border-radius:14px;padding:4px 10px 4px 4px}
.pwr img{width:34px;height:34px}.pwr span{display:block;width:90px;height:11px;border-radius:6px;background:rgba(255,255,255,.22);overflow:hidden}
.pwr i{display:block;height:100%;background:linear-gradient(90deg,#7ef08f,#38c95c);border-radius:6px}
#bbtn{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom) + 16px);width:66px;height:66px;border-radius:20px;background:linear-gradient(#ffffff,#e4e0f2);box-shadow:0 5px 0 #8f86b5,inset 0 2px 0 #fff;display:grid;place-items:center;transition:opacity .2s}
#bbtn img{width:50px;height:50px}#bbtn b{position:absolute;right:-6px;top:-6px;background:#d9478f;border:2px solid #fff;border-radius:12px;min-width:24px;height:24px;font-size:14px;display:grid;place-items:center;padding:0 5px}
#bbtn.off{opacity:.45;filter:grayscale(.7)}
#toast{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%) scale(.6);font-size:30px;opacity:0;white-space:nowrap;transition:transform .28s cubic-bezier(.3,1.7,.5,1),opacity .2s}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}#toast.gold{color:#ffd86a}#toast.red{color:#ff8a7a}
#toast.lm{font-size:18px;top:20%;background:rgba(30,24,64,.55);padding:8px 16px;border-radius:16px;text-shadow:none}
#hint{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:17px;opacity:0;transition:opacity .4s}#hint.show{opacity:1}
#hint div{display:inline-block;background:rgba(30,24,64,.5);border-radius:16px;padding:10px 16px;line-height:1.6}
/* ---------- screens ---------- */
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;text-align:center;padding:20px}
body.menu #menu,body.paused #pause,body.over #over{display:flex}
#menu{justify-content:space-between;padding:calc(env(safe-area-inset-top) + 22px) 16px calc(env(safe-area-inset-bottom) + 22px);background:linear-gradient(rgba(42,35,80,.45),rgba(42,35,80,0) 34%,rgba(42,35,80,0) 52%,rgba(42,35,80,.75));pointer-events:none}
#menu > *{pointer-events:auto}
.logo{line-height:.84}.logo .a{font-size:min(14vw,58px);display:block;transform:rotate(-4deg)}
.logo .b{font-size:min(20vw,86px);display:block;transform:rotate(-4deg);color:#ffd86a;text-shadow:0 5px 0 #c4701c,0 9px 0 #221a48,3px 0 0 #221a48,-3px 0 0 #221a48,0 -3px 0 #221a48,3px 3px 0 #221a48,-3px 3px 0 #221a48,3px -3px 0 #221a48,-3px -3px 0 #221a48}
.tag{font-size:13px;margin-top:10px}.pill{display:inline-block;margin-top:8px;font-size:11px;background:#d9478f;padding:4px 10px;border-radius:10px;text-shadow:none}
.panel{background:rgba(30,24,64,.66);border-radius:18px;padding:10px 12px;width:min(92vw,380px);margin:0 auto 12px;text-align:left}
.panel h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.panel h4 span{background:linear-gradient(#ffd86a,#e8a320);color:#5a3200;border-radius:9px;padding:2px 8px;text-shadow:none}
.ms{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 0;border-top:1px solid rgba(255,255,255,.1)}.ms b{width:18px;height:18px;border-radius:6px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:12px}
.ms span{flex:1}.ms em{font-style:normal;opacity:.8}.ms.done b{background:#38c95c}.ms.done span{opacity:.7}
.stats{display:flex;gap:10px;justify-content:center;margin-bottom:12px}
.stat{background:rgba(30,24,64,.66);border-radius:16px;padding:7px 14px;min-width:104px}.stat small{display:block;font-size:11px;opacity:.8;text-shadow:none}.stat b{font-size:21px}
.big{font:900 26px Mont,sans-serif;color:#fff;border-radius:22px;padding:16px 50px;background:linear-gradient(#7ae08a,#34b956);box-shadow:0 6px 0 #1f7f3a,inset 0 3px 0 rgba(255,255,255,.55)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #1f7f3a}
.btnrow{display:flex;gap:10px;justify-content:center;align-items:center}
.sq{font:900 15px Mont,sans-serif;color:#fff;border-radius:18px;padding:14px 16px;background:linear-gradient(#a98be6,#7a5bb5);box-shadow:0 5px 0 #4f3a85,inset 0 3px 0 rgba(255,255,255,.4)}
.card{background:linear-gradient(#3a2f72,#2a2350);border:4px solid #ffd86a;border-radius:26px;padding:20px 20px 22px;width:min(90vw,370px);box-shadow:0 10px 0 rgba(0,0,0,.25)}
.card h2{margin:0 0 10px;font-size:30px;color:#ffd86a}
.line{display:flex;justify-content:space-between;align-items:center;font-size:17px;padding:8px 4px;border-bottom:2px solid rgba(255,255,255,.08)}.line b{font-size:22px}
#oNew{font-size:12px;background:#d9478f;border-radius:10px;padding:3px 8px;margin-left:6px}
.btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:16px}
.small{font:900 14px Mont,sans-serif;color:#fff;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 18px}
#oMs .ms{font-size:12px;text-align:left}
/* shop sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;top:12%;background:linear-gradient(#3a2f72,#2a2350);border-radius:26px 26px 0 0;z-index:9;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);pointer-events:auto;display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:22px}
.sheet header button{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:20px}
#shopBody{overflow:auto;padding:0 14px calc(env(safe-area-inset-bottom) + 20px);touch-action:pan-y}
#shopBody h3{font-size:13px;opacity:.85;margin:14px 2px 6px;text-shadow:none}
.item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:16px;padding:8px 10px;margin-bottom:8px}
.item img{width:46px;height:46px}.item > div{flex:1}.item b{display:block;font-size:14px}.item small{font-size:11px;opacity:.8;text-shadow:none}
.lv{display:flex;gap:4px;margin-top:4px}.lv i{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.2)}.lv i.on{background:#7ef08f}
.buy{font:900 14px Mont,sans-serif;color:#5a3200;background:linear-gradient(#ffd86a,#e8a320);border-radius:12px;padding:9px 12px;box-shadow:0 3px 0 #a86a10;min-width:78px}
.buy.max{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.sw{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}.sw i{width:18px;height:18px;border-radius:50%}
#mute{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);pointer-events:auto;font-size:20px;background:rgba(30,24,64,.5);border-radius:12px;width:44px;height:44px}
body.play #mute{display:none}
#lo{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 12px);pointer-events:auto;font:900 10px Mont,sans-serif;background:rgba(30,24,64,.5);color:#fff;border-radius:10px;padding:6px 9px;display:none}body.menu #lo{display:block}
#fps{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 92px);font-size:10px;opacity:.55;text-shadow:0 1px 2px #000}
#load{position:fixed;inset:0;z-index:20;background:linear-gradient(#3a2f72,#2a2350);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font:900 18px Mont,sans-serif;color:#fff}
#load i{width:44px;height:44px;border-radius:50%;border:5px solid rgba(255,255,255,.2);border-top-color:#ffd86a;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body class="menu">

</div>
<div class="sheet t" id="shop"><header><span>SHOP · <span class="ci">£</span> <span id="shopBank">0</span></span><button id="shopX">✕</button></header><div id="shopBody"></div></div>
<script type="importmap">{"imports": {"three": "/flappy/3d/three.module.min.js"}}</script>

</body></html>
