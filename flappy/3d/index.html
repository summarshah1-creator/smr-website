/* ================= game state + controls ================= */
let state = 'menu', score = 0, best = +(localStorage.getItem('fk3d_best') || 0);

  for (let i = live.length - 1; i >= 0; i--) if (live[i].z1 > B.z + 40) { drop(live[i].g); live.splice(i, 1); }
  for (let i = rows.length - 1; i >= 0; i--) if (rows[i].z > B.z + 30) { drop(rows[i].g); rows.splice(i, 1); }
  trafT -= dt; if (trafT <= 0) { trafT = .5 + Math.random() * .9; spawnCar(Math.random() < .5 ? -1 : 1); }
  for (let i = traffic.length - 1; i >= 0; i--) { const c = traffic[i]; c.z += c.dir * c.v * dt; c.g.position.z = c.z; if (c.z > B.z + 25 || c.z < B.z - 260) { scene.remove(c.g); traffic.splice(i, 1); } }

}
function bake(g) { // merge every mesh of a building into one mesh per material: far fewer draw calls

reset(); if (!qs.has('manual')) requestAnimationFrame(loop); else __step(16);
