<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Flappy Kabootar 3D · Test</title>
<style>
@font-face{font-family:Silk;font-weight:700;src:url(silkb.woff2)}@font-face{font-family:PS;src:url(ps2p.woff2)}
html,body{margin:0;height:100%;overflow:hidden;background:#87b8e6;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;font-family:Silk,monospace}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#score{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:0;right:0;text-align:center;font:48px PS,monospace;color:#fff;text-shadow:0 4px 0 #1b1a24,3px 0 #1b1a24,-3px 0 #1b1a24,0 -3px #1b1a24}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86vw,360px);background:rgba(27,26,36,.88);border:4px solid #ffd84a;border-radius:18px;color:#fff;text-align:center;padding:18px 16px 16px;pointer-events:auto}
.card h1{font:22px/1.4 PS,monospace;color:#ffd84a;margin:4px 0 8px}
.card p{font:700 13px/1.55 Silk,monospace;margin:8px 0;color:#e9e6f5}
.card .warn{background:#3a2a10;border:2px solid #f0a030;border-radius:10px;padding:8px;color:#ffd8a0}
.card button{font:14px PS,monospace;background:#3fbf4a;color:#fff;border:3px solid #1b1a24;border-radius:12px;padding:12px 18px;margin-top:8px;box-shadow:0 4px 0 #1b1a24;cursor:pointer}
.hide{display:none!important}
#lo{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);pointer-events:auto;font:700 11px Silk,monospace;background:rgba(27,26,36,.7);color:#fff;border:2px solid #fff6;border-radius:10px;padding:6px 9px}
#fps{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);font:700 11px Silk,monospace;color:#fff;text-shadow:0 1px 2px #000}
#tag{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:10px;font:700 10px Silk,monospace;color:#fff;background:#1b1a24aa;border-radius:8px;padding:4px 7px}
</style></head><body>
<div id="ui">
  <div id="tag">3D TEST</div>
  <div id="score" class="hide">0</div>
  <div class="card" id="start">
    <h1>FLAPPY KABOOTAR 3D</h1>
    <p>Fly down a Luton street. <b>Tap</b> to flap and fly through the gap in each big pipe. The traffic goes round the pipes on their traffic islands.</p>
    <p class="warn">Early test version. It needs a newer phone. If it's slow, tap "Low detail" in the corner.</p>
    <button id="go">PLAY</button>
  </div>
  <div class="card hide" id="over">
    <h1>OUCH!</h1>
    <p id="ovs">Score 0</p>
    <button id="again">PLAY AGAIN</button>
  </div>
  <button id="lo">Low detail: OFF</button>
  <div id="fps"></div>
</div>
<link rel="modulepreload" href="./core.js?v=dev">
<link rel="modulepreload" href="./materials.js?v=dev">
<link rel="modulepreload" href="./cars.js?v=dev">
<link rel="modulepreload" href="./houses.js?v=dev">
<link rel="modulepreload" href="./landmarks.js?v=dev">
<link rel="modulepreload" href="./commercial.js?v=dev">
<link rel="modulepreload" href="./street.js?v=dev">
<link rel="modulepreload" href="./pigeon.js?v=dev">
<script type="importmap">{"imports": {"three": "./three.module.min.js", "./BufferGeometryUtils.js": "./BufferGeometryUtils.js?v=dev", "./core.js": "./core.js?v=dev", "./materials.js": "./materials.js?v=dev", "./cars.js": "./cars.js?v=dev", "./houses.js": "./houses.js?v=dev", "./landmarks.js": "./landmarks.js?v=dev", "./commercial.js": "./commercial.js?v=dev", "./street.js": "./street.js?v=dev", "./pigeon.js": "./pigeon.js?v=dev", "./game.js": "./game.js?v=dev"}}</script>
<script type="module" src="./game.js?v=dev"></script>
</body></html>
