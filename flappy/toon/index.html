<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kabootar Rush: Luton</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9fd3ff;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;font-family:"Lilita One",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff}
.hide{display:none!important}
.out{text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 2px rgba(0,0,0,.5)}
#hud{position:absolute;inset:0}
#pause{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;width:48px;height:48px;border-radius:14px;border:3px solid #fff;background:linear-gradient(#5fb6ff,#2b7fe0);box-shadow:0 4px 0 #1a4f99;pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:6px}
#pause i{display:block;width:7px;height:20px;border-radius:3px;background:#fff}
.pill{position:absolute;right:12px;display:flex;align-items:center;gap:8px;background:rgba(20,28,48,.55);border:2px solid rgba(255,255,255,.35);border-radius:16px;padding:4px 12px 4px 6px;font-size:26px;line-height:1}
#p1{top:calc(env(safe-area-inset-top) + 12px)} #p2{top:calc(env(safe-area-inset-top) + 58px);font-size:22px}
.chip{background:linear-gradient(#ffe066,#ffb020);color:#7a3a00;border-radius:10px;padding:3px 7px;font-size:18px;text-shadow:none}
.seed{width:16px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c0,#ffc83a 45%,#c07a00);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#lm{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 110px);transform:translate(-50%,-20px) scale(.9);opacity:0;transition:.35s cubic-bezier(.2,1.4,.4,1);background:linear-gradient(#ffffff,#eef4ff);color:#1f3260;border-radius:999px;padding:8px 16px 8px 12px;font-size:18px;white-space:nowrap;box-shadow:0 5px 0 rgba(0,0,0,.18)}
#lm::before{content:"📍 ";}
#lm.show{opacity:1;transform:translate(-50%,0) scale(1)}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,380px);text-align:center;pointer-events:auto}
.logo{font-size:54px;line-height:.9;letter-spacing:1px;background:linear-gradient(#fff36b,#ffb020 60%,#ff7a1a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px #7a2a00;filter:drop-shadow(0 5px 0 rgba(0,0,0,.3));transform:rotate(-3deg)}
.rib{display:inline-block;margin-top:10px;background:linear-gradient(#ff5a7a,#e02a5a);border-radius:10px;padding:4px 18px;font-size:26px;box-shadow:0 4px 0 #8a1036;transform:rotate(-3deg)}
.tips{margin:22px auto 6px;background:rgba(20,28,48,.6);border-radius:18px;padding:12px 14px;font-size:16px;line-height:1.5;border:2px solid rgba(255,255,255,.3)}
.btn{font-family:inherit;font-size:30px;color:#fff;border:3px solid #fff;border-radius:20px;padding:12px 40px;margin-top:14px;background:linear-gradient(#7ee05a,#2fae3a);box-shadow:0 6px 0 #1b7a24,0 10px 18px rgba(0,0,0,.25);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1b7a24}
.res{display:flex;gap:10px;justify-content:center;margin-top:16px}
.res div{background:rgba(20,28,48,.6);border-radius:16px;padding:10px 16px;min-width:100px;border:2px solid rgba(255,255,255,.3)}
.res b{display:block;font-size:34px;font-weight:400}.res span{font-size:14px;opacity:.8}
#ovb{margin-top:8px;font-size:18px}
#flash{position:absolute;inset:0;opacity:0;transition:opacity .25s;pointer-events:none}
#lo{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);pointer-events:auto;font:14px "Lilita One",sans-serif;background:rgba(20,28,48,.55);color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:10px;padding:6px 10px}
#fps{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);font-size:12px;opacity:.7}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(#7cc4ff,#c9e8ff)}
</style></head><body>
<div id="ui">
  <div id="flash"></div>
  <div id="hud" class="hide">
    <button id="pause"><i></i><i></i></button>
    <div class="pill out" id="p1"><span class="chip">x1</span><span id="sc">00000</span></div>
    <div class="pill out" id="p2"><span class="seed"></span><span id="sd">0</span></div>
  </div>
  <div id="lm"></div>
  <div class="card hide out" id="start">
    <div class="logo">KABOOTAR<br>RUSH</div><div class="rib">LUTON</div>
    <div class="tips">Swipe <b>← →</b> to change lane<br>Swipe <b>↑</b> to flap over roadworks<br>Swipe <b>↓</b> to swoop under bus gates<br>Grab the golden seeds!</div>
    <button class="btn" id="go">PLAY</button>
  </div>
  <div class="card hide out" id="over">
    <div class="logo" style="font-size:44px">SPLAT!</div>
    <div class="res"><div id="ovs"></div><div id="ovd"></div></div><div id="ovb"></div>
    <button class="btn" id="again">PLAY AGAIN</button>
  </div>
  <div class="card hide out" id="pz"><div class="logo" style="font-size:44px">PAUSED</div><button class="btn" id="resume">CARRY ON</button></div>
  <button id="lo">Low detail: OFF</button>
  <div id="fps"></div>
  <div id="loading">Building Luton…</div>
</div>
<script type="importmap">{"imports":{"three":"../3d/three.module.min.js"}}</script>
<script type="module" src="./game.js"></script>
</body></html>
