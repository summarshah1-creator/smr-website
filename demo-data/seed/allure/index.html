<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Allure Club · Coffee &amp; Desserts, Luton</title>
<meta name="description" content="The Allure members app: collect stamps, spin to win every Friday, unlock rewards and browse the coffee and dessert menu. 1 Riddy Lane, Luton.">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Allure">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{
 --g9:#0F0F0F;--g8:#161616;--g7:#2E2E2E;--g6:#9A7426;--g5:#B8913F;
 --gold:#C9A14A;--gold2:#E6CB85;--gold3:#F6EBCD;
 --cream:#FAF8F3;--cream2:#F3EEE4;--paper:#FFFFFF;--line:#ECE6DA;--line2:#DDD3C0;
 --ink:#141414;--mu:#6E6A63;--mu2:#9A958C;
 --itg:#1E8C45;--itr:#C8272F;--ok:#1E8C45;--bad:#B3261E;--warn:#A86A00;
 --disp:'Fraunces',Georgia,'Times New Roman',serif;--ui:'Outfit',system-ui,-apple-system,sans-serif;--script:'Fraunces',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;
 --metal:linear-gradient(135deg,#B4842E 0%,#DDBB6C 22%,#F8E7AE 42%,#E3C47A 58%,#B88A35 80%,#9C7228 100%);
 --metalH:linear-gradient(90deg,#B4842E 0%,#E8CD86 30%,#FBEDBB 50%,#D9B463 70%,#A97C2C 100%);
 --tri:var(--metalH);
 --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.2,.9,.3,1.15);
 --sh1:0 1px 2px #1414140d,0 4px 14px #1414140f;--sh2:0 2px 6px #14141412,0 14px 40px #1414141a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{overflow:clip}
body{background:#0e0e0e;background-image:radial-gradient(900px 520px at 12% -8%,#2b2b2b 0,transparent 62%),radial-gradient(800px 500px at 100% 110%,#202020 0,transparent 60%);color:var(--ink);font-family:var(--ui);overflow:hidden;font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:not-allowed;opacity:.5}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- stage ---------- */
.switch{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:90;display:flex;background:#111111e8;backdrop-filter:blur(10px);border:1px solid #4a4a4a;border-radius:999px;padding:4px;gap:2px;box-shadow:0 10px 30px #0008}
.switch button{white-space:nowrap;padding:8px 16px;border-radius:999px;font-weight:600;font-size:13px;color:#cfcac0;transition:.25s}
.switch button.on{background:var(--gold);color:var(--g9)}
.switch .mob{display:none}
@media (max-width:1100px){.switch .mob{display:block}}
.stage{display:flex;gap:30px;justify-content:center;align-items:center;height:100vh;padding:62px 24px 20px}
.col{display:flex;flex-direction:column;gap:10px;height:100%;max-height:900px;min-width:0}
.cap{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#b3ab9c;font-weight:600;text-align:center}
.phone{overflow:clip!important;width:390px;flex:1;min-height:0;border-radius:48px;border:10px solid #0a0a0a;box-shadow:0 0 0 1px #4a4a4a,0 40px 120px #000c;background:var(--cream);position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column}
.tablet{width:min(860px,calc(100vw - 500px));flex:1;min-height:0;border-radius:28px;border:12px solid #0a0a0a;box-shadow:0 0 0 1px #4a4a4a,0 40px 120px #000a;background:var(--g9);color:#f5f3ef;position:relative;overflow:hidden;isolation:isolate}
.adminwrap{width:min(1080px,calc(100vw - 500px));flex:1;min-height:0;border-radius:20px;overflow:hidden;position:relative;background:var(--cream);display:flex;box-shadow:0 40px 120px #000a;isolation:isolate}
body.v-terminal .colA{display:none}
body.v-admin .colT{display:none}
/* single-surface routes (deployments): #app  #terminal  #admin */
body.only .switch,body.only .cap{display:none}
body.only .stage{padding:0;gap:0;height:100dvh}
body.only .col{max-height:none;width:100%}
body.only .phone,body.only .tablet,body.only .adminwrap{width:100%;border:0;border-radius:0;box-shadow:none}
body.only-app .colT,body.only-app .colA,body.only-terminal .colP,body.only-terminal .colA,body.only-admin .colP,body.only-admin .colT{display:none}
body.only-app{background:var(--cream)}
body.only-app .c-head{padding-top:calc(12px + env(safe-area-inset-top))}
body.only-app .tabbar{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
body.only-terminal .t-top{padding-top:calc(14px + env(safe-area-inset-top))}
@media (min-width:700px){body.only-app .phone{max-width:480px;margin:0 auto;box-shadow:0 0 0 1px var(--line)}body.only-app{background:var(--cream2)}}
@media (max-width:1100px){
 .stage{padding:56px 0 0;gap:0;height:100dvh}.cap{display:none}.col{width:100%;max-height:none}
 .phone,.tablet,.adminwrap{width:100%;border:0;border-radius:0;box-shadow:none}
 body.m-phone .colT,body.m-phone .colA,body.m-terminal .colP,body.m-terminal .colA,body.m-admin .colP,body.m-admin .colT{display:none!important}
 .switch{top:8px}.switch button{padding:7px 12px;font-size:12px}
}

/* ---------- customer: header ---------- */
.c-head{flex:none;background:var(--g8);color:#fff;padding:46px 18px 12px;position:relative;z-index:3}
.c-head::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--tri);opacity:.9}
.hrow{display:flex;align-items:center;gap:12px;min-height:44px}
.hlogo{height:40px;width:auto;display:block}
.hname{flex:1;min-width:0;line-height:1.05}
.hname b{display:block;font-family:var(--disp);font-size:21px;font-weight:600;letter-spacing:.01em}
.hname small{display:block;font-family:var(--script);font-size:20px;color:var(--gold2);margin-top:-2px}
.hbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ffffff12;border:1px solid #ffffff22;position:relative;flex:none}
.hbtn .dot{position:absolute;top:5px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--itr);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--g8)}
.htitle{display:flex;align-items:center;gap:10px;min-height:44px}
.htitle h1{flex:1;margin:0;font-family:var(--disp);font-weight:600;font-size:26px;letter-spacing:.01em}
.htitle .back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ffffff12;border:1px solid #ffffff22}
.c-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;padding-bottom:26px;scrollbar-width:none}
.c-scroll::-webkit-scrollbar{display:none}
.screen{animation:fadeUp .35s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* tabbar */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border-top:1px solid var(--line);padding:6px 6px 22px;position:relative;z-index:3}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 3px;color:var(--mu);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;position:relative;border-radius:14px}
.tab svg.i{width:22px;height:22px}
.tab.on{color:var(--g8)}
.tab.on::before{content:'';position:absolute;top:-7px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--tri)}

/* type */
.eyeb{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--gold)}
.sec{padding:22px 18px 0}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px}
.sech h3{margin:0;font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:.01em;color:var(--g8)}
.sech a,.sech button{font-size:12px;font-weight:600;color:var(--g6);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.rule{height:2px;background:var(--tri);border-radius:2px;width:56px;margin:8px 0 0}
.mut{color:var(--mu)}
p{line-height:1.5}

/* greeting */
.greet{padding:20px 18px 0}
.greet h2{margin:0;font-family:var(--disp);font-size:30px;font-weight:600;color:var(--g8);line-height:1.1}
.greet p{margin:4px 0 0;color:var(--mu);font-size:14px}

/* stamp card */
.ccard{margin:16px 18px 0;border-radius:24px;background:var(--g8);color:#fff;padding:20px 18px 18px;position:relative;overflow:hidden;box-shadow:var(--sh2)}
.ccard::before{content:'';position:absolute;inset:0;background:radial-gradient(420px 220px at 110% -20%,#4a4a4a 0,transparent 62%),radial-gradient(300px 200px at -20% 120%,#111111 0,transparent 70%);pointer-events:none}
.ccard>*{position:relative}
.ccard .ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ccard .ctop .eyeb{color:var(--gold2)}
.ccard .cnt{font-family:var(--disp);font-size:44px;font-weight:600;line-height:1;margin-top:6px}
.ccard .cnt small{font-size:20px;color:#cfcac0;font-weight:500}
.ccard .cnt em{font-style:normal;font-family:var(--ui);font-size:13px;color:#cfcac0;letter-spacing:.04em;margin-left:6px}
.ccard .cmsg{margin:6px 0 0;font-size:14px;color:#f1ede6}
.ccard .cmsg b{color:var(--gold2)}
.ccard .tri{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--tri)}
.cmini{width:64px;flex:none;opacity:.95}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 4px}
.stp{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;border:1.5px dashed #ffffff40;color:#ffffff30;transition:.3s}
.stp svg{width:46%;height:46%}
.stp.on{border:0;background:radial-gradient(circle at 35% 30%,#f2dca8,#c9a14a 70%);color:var(--g8);box-shadow:inset 0 -3px 0 #a4823f,0 4px 10px #0004}
.stp.on::after{content:'';position:absolute;inset:4px;border-radius:50%;border:1px solid #16161633}
.stp.new{animation:stampIn .7s var(--spring) both}
@keyframes stampIn{0%{transform:scale(1.8) rotate(-25deg);opacity:0}60%{transform:scale(.9) rotate(4deg);opacity:1}100%{transform:none}}
.stp i{position:absolute;bottom:-3px;right:-3px;font-style:normal;font-size:9px;font-weight:700;width:18px;height:18px;border-radius:50%;background:var(--g9);color:var(--gold2);display:grid;place-items:center;border:1px solid #ffffff22}
.cfoot{display:flex;gap:8px;margin-top:14px}
.qrbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;background:var(--gold);color:var(--g9);border-radius:14px;padding:14px 12px;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 4px 0 #9b7c3f;transition:transform .15s}
.qrbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #9b7c3f}
.rwchip{display:flex;align-items:center;gap:8px;margin-top:12px;background:#ffffff14;border:1px solid #ffffff26;border-radius:12px;padding:10px 12px;font-size:13px;width:100%;text-align:left}
.rwchip b{color:var(--gold2)}
.rwchip svg.i:last-child{margin-left:auto}

/* carousel */
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 18px 6px;margin:0 -18px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car>*{scroll-snap-align:start;flex:none}
.evc{width:292px;border-radius:22px;overflow:hidden;position:relative;color:#fff;display:flex;flex-direction:column;box-shadow:var(--sh2);background:var(--g8);text-align:left}
.evc .bg{position:relative;height:150px;background-size:cover;background-position:center 22%;flex:none;overflow:hidden}
.evc .bg::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--tri)}
.evc .in{position:relative;padding:14px 16px 16px;flex:1;display:flex;flex-direction:column}
.evc .eyeb{color:var(--gold2)}
.evc h4{margin:4px 0 4px;font-family:var(--disp);font-size:23px;font-weight:600;line-height:1.1}
.evc p{margin:0 0 12px;font-size:13px;color:#ece8e0;flex:1}
.evc .go{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold2);color:var(--gold3);border-radius:999px;padding:7px 14px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.evc .go svg.i{width:14px;height:14px}
.evc .soldout{position:absolute;top:12px;right:12px;background:var(--itr);color:#fff;font-size:10px;font-weight:700;letter-spacing:.16em;padding:5px 10px;border-radius:999px;z-index:2}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line2);transition:.3s}
.dots i.on{width:18px;background:var(--g7)}
/* NYE art (built, no photo) */
.nyebg{background:radial-gradient(260px 160px at 80% 10%,#e6cb8555 0,transparent 70%),radial-gradient(300px 200px at 0% 100%,#333333 0,transparent 70%),linear-gradient(160deg,#111111,#161616)}
.nyebg .spk{position:absolute;border-radius:50%;background:var(--gold2);opacity:.8;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
.nyebg .num{position:absolute;right:14px;top:4px;font-family:var(--disp);font-weight:600;font-size:120px;line-height:1;color:transparent;-webkit-text-stroke:1px #e6cb8599;letter-spacing:-.02em}
.nyebg .nyet{position:absolute;left:18px;bottom:18px;font-family:var(--script);font-size:38px;line-height:.9;color:var(--gold2)}

/* offers row */
.ofc{width:212px;border-radius:18px;background:var(--paper);border:1px solid var(--line);padding:14px;box-shadow:var(--sh1);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px}
.ofc .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--cream2);color:var(--g7)}
.ofc.gold .ic{background:var(--g8);color:var(--gold2)}
.ofc b{font-family:var(--disp);font-size:19px;font-weight:600;color:var(--g8);line-height:1.1}
.ofc small{font-size:12.5px;color:var(--mu);line-height:1.4}
.ofc .tag{margin-top:auto;align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--itg);background:#1e8c4514;padding:4px 8px;border-radius:999px}
.ofc .tag.r{color:var(--itr);background:#c8272f12}
.ofc .tag.g{color:var(--warn);background:#a86a0012}

/* news */
.news{display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:10px;margin-bottom:10px;box-shadow:var(--sh1);align-items:center;text-align:left;width:100%}
.news .th{width:78px;height:78px;border-radius:12px;flex:none;background:var(--cream2) center/cover;display:grid;place-items:center;color:var(--g6)}
.news b{display:block;font-family:var(--disp);font-size:19px;font-weight:600;color:var(--g8);line-height:1.1}
.news p{margin:3px 0 0;font-size:13px;color:var(--mu);line-height:1.4}
.news .k{font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}

/* generic cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 18px 0;box-shadow:var(--sh1)}
.card h4{margin:0 0 10px;display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:20px;font-weight:600;color:var(--g8)}
.card h4 svg.i{color:var(--gold)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-of-type{border-top:0}
.row .ri{width:36px;height:36px;border-radius:11px;background:var(--cream2);color:var(--g7);display:grid;place-items:center;flex:none}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-weight:600;font-size:14.5px}
.row .rt small{display:block;color:var(--mu);font-size:12.5px;margin-top:1px}
.row>svg.i:last-child{color:var(--mu2)}
.cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--g8);color:#fff;border-radius:14px;padding:15px 16px;font-weight:600;font-size:13.5px;letter-spacing:.12em;text-transform:uppercase;transition:transform .15s,background .2s}
.cta:active{transform:scale(.98)}
.cta.gold{background:var(--gold);color:var(--g9)}
.cta.line{background:transparent;color:var(--g8);border:1.5px solid var(--g8)}
.cta.danger{background:var(--bad)}
.ghost{display:block;width:100%;text-align:center;padding:12px;color:var(--mu);font-size:13.5px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;background:var(--cream2);color:var(--g7)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--cream2);color:var(--g7)}
.badge.ok{background:#1e8c4518;color:var(--itg)}.badge.bad{background:#b3261e14;color:var(--bad)}.badge.warn{background:#a86a0016;color:var(--warn)}.badge.gold{background:var(--g8);color:var(--gold2)}
.note{font-size:12.5px;color:var(--mu);line-height:1.5}
.demobox{display:flex;gap:10px;align-items:flex-start;background:#fff7e0;border:1px dashed #d9b35c;color:#6b5418;border-radius:14px;padding:11px 12px;font-size:12px;line-height:1.45;margin-top:14px}
.demobox svg.i{width:16px;height:16px;margin-top:1px}
.demobox a{font-weight:700;text-decoration:underline;cursor:pointer}

/* hero (signed out) */
.hero{margin:16px 18px 0;border-radius:24px;overflow:hidden;background:var(--g8);color:#fff;position:relative;padding:26px 20px 20px;box-shadow:var(--sh2)}
.hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--tri)}
.hero h2{margin:8px 0 6px;font-family:var(--disp);font-size:32px;font-weight:600;line-height:1.05}
.hero h2 em{font-family:var(--script);font-style:normal;font-weight:400;color:var(--gold2);font-size:40px}
.hero p{margin:0 0 16px;color:#ece8e0;font-size:14px}
.hero .perks{display:grid;gap:8px;margin:0 0 18px}
.hero .perks div{display:flex;gap:10px;align-items:center;font-size:13.5px;color:#f2efe9}
.hero .perks svg.i{color:var(--gold2);width:18px;height:18px}
.hero .stamps{grid-template-columns:repeat(8,1fr);gap:5px;margin:0 0 16px}

/* sheet */
.backdrop{position:absolute;inset:0;background:#11111188;opacity:0;pointer-events:none;transition:.3s;z-index:20;backdrop-filter:blur(2px)}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--paper);border-radius:28px 28px 0 0;z-index:21;transform:translateY(105%);transition:transform .42s var(--ease);overflow-y:auto;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet.show{transform:none}
.sheet::before{content:'';display:block;width:42px;height:5px;border-radius:3px;background:var(--line2);margin:10px auto 0}
.sh-x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--cream2);color:var(--g8);z-index:2}
.sh-body{padding:14px 20px 34px}
.sh-body h2{margin:6px 0 6px;font-family:var(--disp);font-size:28px;font-weight:600;color:var(--g8);line-height:1.1}
.sh-body>p{margin:0 0 14px;color:var(--mu);font-size:14px}
.center{text-align:center}

/* QR */
.qrwrap{background:#fff;border-radius:22px;padding:18px;margin:14px auto 0;width:fit-content;box-shadow:var(--sh1);border:1px solid var(--line);position:relative}
.qrbox{width:212px;height:212px;display:grid;place-items:center}
.qrbox img,.qrbox canvas{width:212px!important;height:212px!important;image-rendering:pixelated}
.qrwrap .lg{position:absolute;left:50%;top:calc(18px + 106px);width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--g8);display:grid;place-items:center;border:3px solid #fff}
.qrwrap .lg img{width:38px}
.mcode{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.12em;text-align:center;margin-top:12px;color:var(--g8)}
.mcode small{display:block;font-family:var(--ui);font-weight:500;font-size:11px;letter-spacing:.16em;color:var(--mu);text-transform:uppercase;margin-bottom:2px}
.bars{display:block;margin:14px auto 0;width:100%;max-width:320px;height:70px}
.qrlive{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--itg);font-weight:600;margin-top:10px}
.qrlive i{width:8px;height:8px;border-radius:50%;background:var(--itg);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}

/* vouchers */
.vch{display:flex;border-radius:18px;overflow:hidden;background:var(--paper);border:1px solid var(--line);box-shadow:var(--sh1);margin-bottom:10px;width:100%;text-align:left;position:relative}
.vch .vl{width:92px;flex:none;background:var(--g8);color:var(--gold2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 6px;position:relative;text-align:center}
.vch .vl b{font-family:var(--disp);font-size:24px;font-weight:600;line-height:1;color:#fff}
.vch .vl small{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}
.vch .vl::after{content:'';position:absolute;right:-7px;top:0;bottom:0;width:14px;background:radial-gradient(circle at 7px 8px,var(--cream) 5px,transparent 5.5px) 0 0/14px 16px repeat-y}
.vch .vr{flex:1;padding:12px 14px 12px 18px;min-width:0}
.vch .vr b{display:block;font-family:var(--disp);font-size:19px;font-weight:600;color:var(--g8);line-height:1.15}
.vch .vr small{display:block;font-size:12px;color:var(--mu);margin-top:3px}
.vch .vr .use{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--g6)}
.vch.used{opacity:.55;filter:grayscale(.6)}
.vch.drink .vl{background:linear-gradient(160deg,#c9a14a,#a4823f);color:var(--g9)}
.vch.drink .vl b{color:var(--g9)}
.vch.bday .vl{background:#7d1d22;color:#f3d3c9}
.vch.fb .vl{background:var(--g6)}
.vdet{border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin-top:14px}
.vdet .dr{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.vdet .dr:first-child{border-top:0}
.vdet .dr span{color:var(--mu)}
.vdet .dr b{font-weight:600;text-align:right}
.vbig{text-align:center;margin-top:6px}
.vbig .amt{font-family:var(--disp);font-size:46px;font-weight:600;color:var(--g8);line-height:1}
.vstat{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:10px}
.vstat.ok{background:#1e8c4516;color:var(--itg)}.vstat.used{background:var(--cream2);color:var(--mu)}

/* menu */
.mnote{margin:14px 18px 0;display:flex;gap:10px;align-items:center;background:var(--g8);color:#f1ede6;border-radius:14px;padding:11px 14px;font-size:12.5px;line-height:1.4}
.mnote svg.i{color:var(--gold2)}
.msearch{margin:12px 18px 0;display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:0 14px;color:var(--mu)}
.msearch input{flex:1;border:0;background:transparent;padding:13px 0;outline:0;color:var(--ink);font-size:15px}
.chips{position:sticky;top:0;z-index:2;display:flex;gap:8px;overflow-x:auto;padding:12px 18px;background:var(--cream);scrollbar-width:none;border-bottom:1px solid transparent}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;font-weight:600;color:var(--g7);background:var(--paper);white-space:nowrap}
.chip.on{background:var(--g8);color:#fff;border-color:var(--g8)}
.msec{padding:8px 18px 4px}
.msec h3{margin:10px 0 0;font-family:var(--disp);font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--g8)}
.msec .rule{width:100%;height:2px;margin:6px 0 4px}
.msec .snote{font-size:12px;color:var(--mu);margin:6px 0 0}
.mi{display:flex;gap:12px;padding:14px 0;border-bottom:1px dotted var(--line2);width:100%;text-align:left;align-items:flex-start}
.mi:last-child{border-bottom:0}
.mi .ph{width:74px;height:74px;border-radius:14px;flex:none;background:var(--cream2) center/cover;box-shadow:var(--sh1)}
.mi .mt{flex:1;min-width:0}
.mi .nm{display:flex;align-items:baseline;gap:8px}
.mi .nm b{font-weight:600;font-size:14.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.mi .nm .dl{flex:1;border-bottom:1px dotted var(--line2);transform:translateY(-4px);min-width:10px}
.mi .nm .pr{font-weight:600;font-size:14.5px;color:var(--g8);white-space:nowrap}
.mi .ds{font-size:12.5px;color:var(--mu);margin-top:3px;line-height:1.45}
.mi .sz{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mi .sz span{font-size:11.5px;background:var(--cream2);border-radius:8px;padding:3px 8px;color:var(--g7)}
.mi .sz span b{font-weight:600}
.mi .lf{display:inline-flex;color:var(--itg);vertical-align:-3px}
.mi .lf svg.i{width:15px;height:15px}
.mi.out{opacity:.55}
.mi .na{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--bad);text-transform:uppercase;margin-top:5px}
.allerg{margin:18px 18px 0;font-size:11.5px;color:var(--mu);line-height:1.5;text-align:center}
.idet .iph{height:230px;margin:-14px -20px 14px;background:var(--cream2) center/cover}

/* event page */
.evhero{position:relative;min-height:300px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;background:var(--g8) center/cover;overflow:hidden}
.evhero.plain{min-height:340px}.evhero.plain::after{display:none}
.evhero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,#111111f2 92%)}
.evhero .in{position:relative;z-index:1;padding:20px 18px 20px}
.evhero h2{margin:4px 0 2px;font-family:var(--disp);font-size:36px;font-weight:600;line-height:1}
.evhero h2 em{font-family:var(--script);font-style:normal;font-weight:400;color:var(--gold2);font-size:46px;display:block;margin-top:-4px}
.evhero .when{display:inline-flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold3);border-top:1px solid #e6cb8566;border-bottom:1px solid #e6cb8566;padding:6px 0}
.evfacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 18px 0}
.evfacts div{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px}
.evfacts small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);font-weight:600}
.evfacts b{display:block;font-family:var(--disp);font-size:22px;font-weight:600;color:var(--g8);margin-top:2px;line-height:1.1}
.evfacts b.tbc{font-family:var(--ui);font-size:13px;color:var(--warn);font-weight:600;margin-top:5px}
.course{margin-top:6px}
.course h5{margin:16px 0 4px;text-align:center;font-family:var(--disp);font-size:18px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px}
.course h5::before,.course h5::after{content:'';flex:1;height:1px;background:var(--line2)}
.course .ci{text-align:center;padding:7px 0}
.course .ci b{display:block;font-family:var(--disp);font-size:19px;font-weight:600;color:var(--g8)}
.course .ci small{display:block;font-size:12.5px;color:var(--mu);line-height:1.4;max-width:280px;margin:2px auto 0}
.evcta{position:sticky;bottom:0;padding:12px 18px 14px;background:linear-gradient(180deg,transparent,var(--cream) 30%);z-index:2}
.tbcbox{border:1.5px dashed var(--gold);background:#fffaf0;border-radius:16px;padding:14px;text-align:center;color:#6b5418;font-size:13px}
.tbcbox b{display:block;font-family:var(--disp);font-size:20px;color:var(--g8);margin-bottom:2px}
.nyehero{background:radial-gradient(380px 240px at 85% 0%,#e6cb8540 0,transparent 70%),linear-gradient(170deg,#111111,#161616 60%,#262626)}
.nyehero .num{position:absolute;right:-6px;top:30px;font-family:var(--disp);font-weight:600;font-size:150px;line-height:1;color:transparent;-webkit-text-stroke:1px #e6cb8577;z-index:1}
.archived{margin:14px 18px 0;background:var(--cream2);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--mu)}

/* forms */
.fld{display:block;margin:0 0 12px}
.fld>span{display:block;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--mu);margin:0 0 6px;text-transform:uppercase}
.fld input,.fld select,.fld textarea{width:100%;background:#fff;border:1.5px solid var(--line2);border-radius:12px;padding:12px 13px;outline:0;font-size:15px;transition:border .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--g6)}
.fld textarea{resize:vertical;min-height:70px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ferr{color:var(--bad);font-size:12.5px;margin:-6px 0 10px;min-height:0}
.ferr:empty{display:none}
.ferr.ok{color:var(--itg)}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink);margin:4px 0 12px;line-height:1.4}
.ck input{width:20px;height:20px;accent-color:var(--g8);flex:none;margin:0}
.pwrules{list-style:none;padding:0;margin:-4px 0 12px;display:flex;flex-wrap:wrap;gap:6px}
.pwrules li{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--mu);background:var(--cream2);border-radius:999px;padding:3px 9px 3px 6px}
.pwrules li svg.i{width:13px;height:13px;opacity:.3}
.pwrules li.ok{color:var(--itg)}.pwrules li.ok svg.i{opacity:1}
.aswitch{text-align:center;font-size:13.5px;color:var(--mu);margin:12px 0 0}
.aswitch a{color:var(--g7);font-weight:600;cursor:pointer;text-decoration:underline}
.tog{position:relative;width:46px;height:28px;flex:none}
.tog input{opacity:0;width:0;height:0;position:absolute}
.tog span{position:absolute;inset:0;border-radius:14px;background:var(--line2);transition:.25s}
.tog span::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:.25s var(--spring)}
.tog input:checked+span{background:var(--g6)}
.tog input:checked+span::after{transform:translateX(18px)}
.tog input:disabled+span{opacity:.6}

/* survey */
.svq{padding:14px 0;border-top:1px solid var(--line)}
.svq:first-of-type{border-top:0}
.svq>b{display:block;font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.35}
.svq>b small{font-weight:400;color:var(--mu)}
.stars{display:flex;gap:6px}
.stars button{width:44px;height:44px;border-radius:12px;background:var(--cream2);font-size:24px;color:var(--line2);transition:.15s;line-height:1}
.stars button.on{background:var(--g8);color:var(--gold2)}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.nps button{height:38px;border-radius:9px;background:var(--cream2);font-size:13px;font-weight:600;color:var(--g7)}
.nps button.on{background:var(--g8);color:#fff}
.npsl{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-top:5px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opts button{padding:8px 13px;border-radius:999px;border:1.5px solid var(--line2);font-size:13px;font-weight:500;color:var(--g7);background:#fff}
.opts button.on{background:var(--g8);border-color:var(--g8);color:#fff}
.svprog{height:4px;border-radius:2px;background:var(--cream2);margin:10px 0 4px;overflow:hidden}
.svprog i{display:block;height:100%;background:var(--tri);transition:width .3s}
.thanks{text-align:center;padding:10px 0}
.thanks .big{width:84px;height:84px;border-radius:50%;margin:8px auto 10px;display:grid;place-items:center;background:var(--g8);color:var(--gold2)}
.thanks .big svg.i{width:40px;height:40px}
.thanks h2{font-size:28px!important}

/* refer */
.refbox{background:var(--g8);color:#fff;border-radius:20px;padding:18px;text-align:center;margin-top:12px}
.refbox small{font-size:10px;letter-spacing:.18em;color:var(--gold2);text-transform:uppercase;font-weight:600}
.refbox .code{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:.12em;margin:6px 0 2px}
.shr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.shr a{text-decoration:none}.shr a,.shr button{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 6px;font-size:12px;font-weight:600;color:var(--g7)}
.steps{counter-reset:s;margin:14px 0 0;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:13.5px;line-height:1.45}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--cream2);color:var(--g8);font-weight:700;font-size:12px;display:grid;place-items:center;font-family:var(--disp);font-size:16px}

/* profile */
.prof{margin:16px 18px 0;background:var(--g8);color:#fff;border-radius:22px;padding:18px;display:flex;gap:14px;align-items:center;position:relative;overflow:hidden}
.prof::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--tri)}
.av{width:58px;height:58px;border-radius:50%;background:var(--gold);color:var(--g9);display:grid;place-items:center;font-family:var(--disp);font-size:26px;font-weight:600;flex:none}
.prof b{display:block;font-family:var(--disp);font-size:24px;font-weight:600;line-height:1.1}
.prof small{display:block;font-family:var(--mono);font-size:12px;color:var(--gold2);letter-spacing:.08em;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 18px 0}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stats b{display:block;font-family:var(--disp);font-size:28px;font-weight:600;color:var(--g8);line-height:1}
.stats small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-weight:600}
.setr{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.setr:first-of-type{border-top:0}
.setr .st{flex:1;min-width:0}
.setr .st b{display:block;font-size:14px;font-weight:600}
.setr .st small{display:block;font-size:12px;color:var(--mu);margin-top:2px;line-height:1.35}
.sbtn{font-size:12px;font-weight:600;color:var(--g7);border:1.5px solid var(--line2);border-radius:999px;padding:7px 12px;white-space:nowrap}
.delbtn{display:flex;align-items:center;gap:8px;justify-content:center;width:100%;margin-top:12px;color:var(--bad);font-weight:600;font-size:13.5px;padding:10px}

/* visit */
.vmap{margin:16px 18px 0;border-radius:20px;overflow:hidden;position:relative;height:150px;background:#E6DFCD;display:block;border:1px solid var(--line)}
.vmap svg{position:absolute;inset:0;width:100%;height:100%}
.vmap .pin{position:absolute;left:50%;top:44%;transform:translate(-50%,-100%);width:42px;height:42px;border-radius:50% 50% 50% 0;rotate:-45deg;background:var(--g8);display:grid;place-items:center;box-shadow:0 6px 16px #0004}
.vmap .pin img{rotate:45deg;width:30px}
.vmap .lbl{position:absolute;left:12px;bottom:12px;background:var(--paper);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--g8);display:flex;gap:6px;align-items:center;box-shadow:var(--sh1)}
.open{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.open i{width:8px;height:8px;border-radius:50%;background:var(--itg)}
.open.no i{background:var(--itr)}
.hrs{width:100%;border-collapse:collapse;font-size:13.5px}
.hrs td{padding:8px 0;border-top:1px solid var(--line)}
.hrs tr:first-child td{border-top:0}
.hrs td:last-child{text-align:right;color:var(--g8);font-weight:500}
.hrs tr.today td{font-weight:700;color:var(--g8)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 18px 0}
.acts a,.acts button{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 6px;font-size:12px;font-weight:600;color:var(--g7);text-decoration:none;box-shadow:var(--sh1)}
.acts svg.i{width:22px;height:22px;color:var(--g8)}

/* inbox */
.msg{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.msg:first-child{border-top:0}
.msg .mi2{width:38px;height:38px;border-radius:50%;background:var(--cream2);color:var(--g7);display:grid;place-items:center;flex:none}
.msg.un .mi2{background:var(--g8);color:var(--gold2)}
.msg b{display:block;font-size:14px;font-weight:600}
.msg p{margin:2px 0 0;font-size:13px;color:var(--mu);line-height:1.4}
.msg small{font-size:11px;color:var(--mu2)}
.empty{text-align:center;padding:30px 20px;color:var(--mu)}
.empty svg.i{width:40px;height:40px;color:var(--line2);margin-bottom:8px}
.empty b{display:block;font-family:var(--disp);font-size:20px;color:var(--g8);font-weight:600}

/* history */
.hist{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.hist:first-child{border-top:0}
.hist .hd{flex:1}
.hist small{display:block;color:var(--mu);font-size:11.5px}
.hist .hv{font-weight:700;color:var(--g7)}
.hist .hv.neg{color:var(--mu)}

/* toast, push, confetti */
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--g9);color:#fff;border-radius:14px;padding:13px 16px;font-size:14px;display:flex;gap:10px;align-items:center;transform:translateY(20px);opacity:0;transition:.35s var(--ease);z-index:40;pointer-events:none;box-shadow:var(--sh2)}
.toast.show{transform:none;opacity:1}
.toast svg.i{color:var(--gold2)}
.pushb{position:absolute;left:10px;right:10px;top:10px;background:#fbf9f4f2;backdrop-filter:blur(14px);border-radius:20px;padding:11px 13px;z-index:45;transform:translateY(-140%);transition:.45s var(--spring);box-shadow:0 10px 30px #0003;cursor:pointer;color:var(--ink)}
.pushb.show{transform:none}
.pushb .ph{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mu);font-weight:600;letter-spacing:.04em}
.pushb .ph img{width:20px;height:20px;border-radius:5px;background:var(--g8);padding:2px}
.pushb .ph span{margin-left:auto;font-weight:400}
.pushb b{display:block;font-size:14px;margin-top:4px}
.pushb p{margin:1px 0 0;font-size:13px;color:#444444;line-height:1.35}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(900px) rotate(720deg);opacity:.6}}
.celebrate{text-align:center}
.celebrate .rwd{width:110px;height:110px;margin:6px auto 12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f2dca8,#c9a14a 70%);display:grid;place-items:center;color:var(--g8);box-shadow:inset 0 -5px 0 #a4823f,0 10px 30px #c9a14a66;animation:stampIn .8s var(--spring)}
.celebrate .rwd svg.i{width:52px;height:52px;stroke-width:1.5}

.vbanner{margin:12px 18px 0;display:flex;gap:10px;align-items:center;background:#fff7e0;border:1px solid #ecd18d;border-radius:14px;padding:10px 12px;font-size:12.5px;color:#6b5418;width:calc(100% - 36px);text-align:left}
.vbanner b{color:#4b3b0f}
.vbanner svg.i{color:var(--warn)}
.mailc{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}

/* ---------- payload formats ----------
   Member QR:  ALR1.M.<token>   (random, revocable — no personal data)
   Voucher QR: ALR1.V.<code>    Voucher barcode (Code 128): the code itself, e.g. AL-7KQ9-M2XD  */
const memberPayload=c=>'ALR1.M.'+c.token;

function parseScan(raw){const s=String(raw||'').trim().toUpperCase().replace(/\s+/g,'');
 let m=s.match(/^ALR1\.M\.([A-Z0-9]{16,32})$/);if(m)return {kind:'member',token:m[1]};
 m=s.match(/^(?:ALR1\.V\.)?(AL-[A-Z0-9]{4}-[A-Z0-9]{4})$/);if(m)return {kind:'voucher',code:m[1]};
 m=s.match(/^AL-?([A-Z0-9]{4})-?([A-Z0-9]{4})$/);if(m)return {kind:'voucher',code:`AL-${m[1]}-${m[2]}`};
 m=s.match(/^(?:AL)?(\d{6})$/);if(m)return {kind:'number',num:'AL'+m[1]};
 return null}

const V_STATUS={valid:['ok','Valid'],used:['bad','Already used'],expired:['bad','Expired'],revoked:['bad','Cancelled'],notyet:['warn','Not valid yet'],limit:['bad','Offer limit reached'],unknown:['bad','Not recognised']};

/* ---------- audiences (UK PECR: marketing only to members who opted in) ---------- */
const AUDS=[['all','All opted-in members'],['new','New members (last 14 days)'],['rewards','Members with available rewards'],['expiring','Rewards expiring in 7 days'],['lapsed','Not visited in 30+ days'],['birthday','Birthday this month']];
function audience(aud,cat){const now=Date.now();return Object.values(DB.customers).filter(c=>{if(c.deleted)return false;
 if(cat==='service'){if(c.notif&&c.notif.rewards===false)return false}else{if(!c.consent||!c.consent.push)return false;if(cat==='events'&&c.notif&&c.notif.events===false)return false;if(cat==='offers'&&c.notif&&c.notif.offers===false)return false}
 const vs=myVouchers(c).filter(vActive);
 switch(aud){case 'new':return now-c.joined<14*DAY;case 'rewards':return vs.length>0;case 'expiring':return vs.some(v=>v.exp&&v.exp-now<7*DAY);
  case 'lapsed':return (c.lastVisit?now-c.lastVisit:now-c.joined)>30*DAY;case 'birthday':return c.dob&&c.dob.m===new Date().getMonth()+1;default:return true}})}

const normEmail=e=>String(e||'').trim().toLowerCase();
function normPhone(cc,num){let d=String(num||'').replace(/[^\d+]/g,'');if(!d)return '';if(d.startsWith('+'))return /^\+\d{8,15}$/.test(d)?d:'';if(d.startsWith('00'))return '+'+d.slice(2);
 const c=String(cc||'+44').replace(/\D/g,'');if(c==='44'){if(d.startsWith('44'))d=d.slice(2);if(d.startsWith('0'))d=d.slice(1);return /^7\d{9}$/.test(d)?'+44'+d:''}if(d.startsWith('0'))d=d.slice(1);return d.length>=6?'+'+c+d:''}
const prettyPhone=p=>p&&p.startsWith('+44')?'0'+p.slice(3,7)+' '+p.slice(7):p||'';
const PW_RULES=[[p=>p.length>=8,'At least 8 characters'],[p=>/[A-Z]/.test(p),'One capital letter'],[p=>/\d/.test(p),'One number']];
function hashPw(p){let h=2166136261;for(const ch of 'te-demo:'+p){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(36)} // demo only — Firebase Auth handles passwords when live

function evStatus(e,t=Date.now()){if(e.status==='draft')return 'draft';if(e.status==='archived')return 'archived';const end=parseDay(e.end,true);if(end&&end<t)return 'past';return e.soldout?'soldout':'live'}

function chartLine(pts,{h=190,min=0,max=5,fmt=v=>v.toFixed(1),col='#333333'}={}){const W=640,PL=34,PR=12,PT=12,PB=26,iw=W-PL-PR,ih=h-PT-PB;const n=pts.length;if(!n)return '';
 const x=i=>PL+(n===1?iw/2:i*iw/(n-1)),y=v=>PT+ih-(v-min)/(max-min||1)*ih;let g='';for(let k=0;k<=4;k++){const v=min+(max-min)*k/4;g+=`<line x1="${PL}" x2="${W-PR}" y1="${y(v)}" y2="${y(v)}" stroke="#ece6da"/><text x="${PL-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`}
 const def=pts.map((p,i)=>p.v==null?null:[x(i),y(p.v)]);let path='',on=false;def.forEach(p=>{if(!p){on=false;return}path+=(on?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);on=true});
 const lab=pts.map((p,i)=>i%Math.ceil(n/8)===0?`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${esc(p.l)}</text>`:'').join('');
 return `<svg class="chart" viewBox="0 0 ${W} ${h}">${g}<path d="${path}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>${def.map((p,i)=>p?`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="${col}" stroke-width="2"><title>${esc(pts[i].l)}: ${fmt(pts[i].v)}</title></circle>`:'').join('')}${lab}</svg>`}
function chartBars(rows,{h=180,col='#333333'}={}){const W=640,PL=30,PR=8,PT=14,PB=26,iw=W-PL-PR,ih=h-PT-PB;const mx=Math.max(1,...rows.map(r=>r.v));const bw=iw/rows.length;
 let g='';for(let k=0;k<=4;k++){const v=Math.round(mx*k/4);const yy=PT+ih-ih*k/4;g+=`<line x1="${PL}" x2="${W-PR}" y1="${yy}" y2="${yy}" stroke="#ece6da"/><text x="${PL-6}" y="${yy+4}" text-anchor="end">${v}</text>`}
 return `<svg class="chart" viewBox="0 0 ${W} ${h}">${g}${rows.map((r,i)=>{const bh=r.v/mx*ih;return `<rect x="${PL+i*bw+bw*.18}" y="${PT+ih-bh}" width="${bw*.64}" height="${bh}" rx="4" fill="${col}"><title>${esc(r.l)}: ${r.v}</title></rect><text x="${PL+i*bw+bw/2}" y="${h-6}" text-anchor="middle">${esc(r.l)}</text>`}).join('')}</svg>`}
function hbars(rows,empty='No answers in this period yet.'){if(!rows.length||rows.every(r=>!r.v))return `<p class="note">${empty}</p>`;const mx=Math.max(...rows.map(r=>r.v));return rows.map(r=>`<div class="hbar"><span>${esc(r.l)}</span><div class="tr"><i style="width:${r.v/mx*100}%"></i></div><b>${r.v}</b></div>`).join('')}
function csvDownload(name,rows){const csv=rows.map(r=>r.map(x=>{const s=String(x??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');

/* =====================================================================
   PAPER LOYALTY CARD → APP
   Staff photograph the customer's old card. The app finds the stamp marks and
   suggests a count; staff check it and confirm. In this test build the count is
   made on the device (below). Live, the backend function readPaperCard reads the
   photo with Claude's image understanding, which copes with any card design.
   ===================================================================== */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
/* 64-bit average hash: spots the same card photographed twice */
function aHash(img){const c=document.createElement('canvas');c.width=c.height=8;const x=c.getContext('2d');x.drawImage(img,0,0,8,8);const d=x.getImageData(0,0,8,8).data;const g=[];for(let i=0;i<64;i++)g.push(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11);const m=g.reduce((a,b)=>a+b,0)/64;return g.map(v=>v>m?'1':'0').join('')}
const hamming=(a,b)=>{let n=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])n++;return n};
/* Finds solid stamp marks: ink (coloured or dark) blobs of similar size, ignoring thin printed outlines and small text. */
function countStamps(img){const W=640,H=Math.round(img.height*W/img.width);const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,W,H);
 const d=x.getImageData(0,0,W,H).data;const N=W*H;const lum=new Float32Array(N),sat=new Float32Array(N);
 for(let i=0;i<N;i++){const r=d[i*4]/255,g=d[i*4+1]/255,b=d[i*4+2]/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);lum[i]=(r*.3+g*.59+b*.11);sat[i]=mx?(mx-mn)/mx:0}
 const sl=[...lum].sort((a,b)=>a-b);const bgL=sl[Math.floor(N*.6)];const ss=[...sat].sort((a,b)=>a-b);const bgS=ss[Math.floor(N*.5)];
 const ink=new Uint8Array(N);for(let i=0;i<N;i++)ink[i]=(sat[i]>Math.max(.32,bgS+.22)&&lum[i]<bgL-.05)||lum[i]<bgL-.38?1:0;
 // close small gaps (stamp texture) with one dilation
 const m=new Uint8Array(N);for(let y=1;y<H-1;y++)for(let xx=1;xx<W-1;xx++){const i=y*W+xx;m[i]=ink[i]|ink[i-1]|ink[i+1]|ink[i-W]|ink[i+W]}
 const lab=new Int32Array(N);const comps=[];const st=[];
 for(let i=0;i<N;i++){if(!m[i]||lab[i])continue;let a=0,minx=W,maxx=0,miny=H,maxy=0,inkN=0;lab[i]=comps.length+1;st.push(i);
  while(st.length){const j=st.pop();a++;inkN+=ink[j];const yy=(j/W)|0,xq=j-yy*W;if(xq<minx)minx=xq;if(xq>maxx)maxx=xq;if(yy<miny)miny=yy;if(yy>maxy)maxy=yy;
   for(const k of [j-1,j+1,j-W,j+W]){if(k>=0&&k<N&&m[k]&&!lab[k]){lab[k]=lab[i];st.push(k)}}}
  const w=maxx-minx+1,h=maxy-miny+1;comps.push({a,inkN,x:minx,y:miny,w,h,fill:a/(w*h),ar:w/h})}
 const area=W*H;let cand=comps.filter(k=>k.a>area*.0012&&k.a<area*.08&&k.ar>.45&&k.ar<2.2&&k.fill>.38&&k.x>2&&k.y>2&&k.x+k.w<W-2&&k.y+k.h<H-2);
 if(cand.length>2){const med=[...cand].map(k=>k.a).sort((a,b)=>a-b)[Math.floor(cand.length/2)];cand=cand.filter(k=>k.a>med*.4&&k.a<med*2.6)}
 const sizes=cand.map(k=>k.a);const spread=sizes.length>1?Math.max(...sizes)/Math.min(...sizes):1;
 return {count:cand.length,conf:cand.length&&spread<2.2?'good':'check',marks:cand.map(k=>({x:k.x/W,y:k.y/H,w:k.w/W,h:k.h/H}))}}
Object.assign(API,{
 paperStatus(c){return c.paper||null},
 transferPaper(staff,{cid,stamps,idem,hash,auto,ref,override}){NEED_STAFF(staff);const P=DB.paper||{on:true,max:8,oncePerMember:true};if(!P.on)fail('off','Paper card transfers are switched off.');
  const dup=DB.txns.find(t=>t.idem===idem);if(dup)return {...dup.result,dup:true};
  const c=DB.customers[cid];if(!c)fail('unknown','Member not found.');const n=parseInt(stamps,10);
  if(!(n>=1&&n<=+P.max))fail('invalid',`Enter between 1 and ${P.max} stamps.`);
  const mgr=['manager','owner'].includes(staff.role);
  if(c.paper&&P.oncePerMember&&!(override&&mgr))fail('done',`A paper card was already transferred for this member on ${dmy(c.paper.at)}. A manager can approve another one.`);
  if(hash){const other=Object.values(DB.customers).find(x=>x.cid!==cid&&x.paper&&x.paper.hash&&hamming(x.paper.hash,hash)<=5);
   if(other&&!(override&&mgr))fail('same-card',`This photo looks like a card already transferred for another member (${shortName(other.name)}). A manager can check and approve it.`)}
  const rw=addStamps(c,n,'paper');c.paper={at:Date.now(),stamps:n,staff:staff.id,hash:hash||null,auto:auto??null,ref:String(ref||'').slice(0,40),count:(c.paper?c.paper.count||1:0)+1};
  const result={cid,added:n,balance:c.stamps,rewards:rw.map(v=>v.code),auto};
  DB.txns.unshift({id:'t'+rid(8),idem,type:'paper',at:Date.now(),cid,stamps:n,ref:c.paper.ref,staff:staff.id,result});
  inbox(c,{t:'Paper card moved to the app',b:`${n} stamp${n>1?'s':''} from your old loyalty card are now on your digital card. You can throw the paper one away.`,link:'rewards',icon:'cup'});
  rw.forEach(v=>inbox(c,{t:'Your free drink is ready',b:'Your card is full. Show your voucher to staff to redeem it.',link:'v:'+v.code,icon:'gift'}));
  audit(staff,'stamps.paper',`Paper card transferred for ${shortName(c.name)}: ${n} stamps${auto!=null&&auto!==n?` (photo counted ${auto}, staff corrected)`:''}${override?' · manager override':''}`,{cid});
  commit();window.dispatchEvent(new CustomEvent('te:stamp',{detail:{cid,result:{...result,qty:0,mult:1,paper:true}}}));return result}
});

 /* ---------- FEEDBACK ---------- */
 s_feedback(c){const F=DB.feedback;if(!c)return `<div class="screen"><div class="sec center"><div class="thanks"><div class="big">${ic('chat')}</div><h2 class="sh-body" style="font-family:var(--disp);font-size:28px;margin:0">Tell us about your visit</h2><p class="mut">Members who complete our short questionnaire get ${F.pct}% off their next visit.</p></div><button class="cta" data-act="auth" data-v="signup">Join to take part</button></div></div>`;

  if(!isVerified(c))return `<div class="screen"><div class="sec"><div class="thanks"><div class="big">${ic('mail')}</div><h2 style="font-family:var(--disp);color:var(--g8);margin:4px 0">Verify your email first</h2><p class="mut">To keep the ${F.pct}% reward fair, please verify your email before taking part.</p></div><button class="cta" data-act="verifySheet">Verify my email</button></div></div>`;
  const s=this.sv;const done=['q1','q2','q3','q4'].filter(k=>s[k]).length;
  const star=(k,label)=>`<div class="svq"><b>${label}</b><div class="stars" role="radiogroup" aria-label="${esc(label)}">${[1,2,3,4,5].map(n=>`<button class="${(s[k]||0)>=n?'on':''}" data-act="sv" data-k="${k}" data-v="${n}" aria-label="${n} star${n>1?'s':''}">★</button>`).join('')}</div></div>`;
  const opt=(k,label,opts,multi)=>`<div class="svq"><b>${label} <small>(optional)</small></b><div class="opts">${opts.map(o=>`<button class="${multi?((s[k]||[]).includes(o)?'on':''):(s[k]===o?'on':'')}" data-act="${multi?'svm':'sv'}" data-k="${k}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`;
  const txt=(k,label,ph)=>`<div class="svq"><b>${label} <small>(optional)</small></b><textarea class="svt" data-k="${k}" rows="2" maxlength="600" placeholder="${esc(ph)}" style="width:100%;border:1.5px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:14px;resize:vertical">${esc(s[k]||'')}</textarea></div>`;
  return `<div class="screen"><div class="card"><div class="eyeb">About 2 minutes · ${F.pct}% off when you finish</div><div class="svprog"><i style="width:${done/4*100}%"></i></div><p class="note" style="margin:4px 0 0">Only the four star ratings are needed. Everything else is optional. Your reward doesn’t depend on what you say.</p></div>
  <div class="card">${star('q1','1. Overall, how would you rate your experience?')}${star('q2','2. How would you rate the quality of your food or drinks?')}${star('q3','3. How would you rate the customer service?')}${star('q4','4. How would you rate the atmosphere and cleanliness?')}
  ${opt('q5','5. Was your order served in a reasonable time?',['Yes','Mostly','No'])}
  ${opt('q6','6. What did you purchase or try?',['Hot coffee','Iced coffee','Matcha','Ube','Frappé','Refresher','French toast','Waffle','Crêpe','Cookie dough','Kids dessert'],true)}
  ${opt('q7','7. What did you enjoy most about your visit?',['The desserts','The drinks','The staff','The atmosphere','Value for money','Speed'],true)}
  ${txt('q8','8. Is there anything we could improve?','Anything at all, big or small')}
  <div class="svq"><b>9. How likely are you to recommend Allure? <small>(optional)</small></b><div class="nps">${[...Array(11)].map((_,n)=>`<button class="${s.q9===n?'on':''}" data-act="sv" data-k="q9" data-v="${n}">${n}</button>`).join('')}</div><div class="npsl"><span>Not likely</span><span>Very likely</span></div></div>
  ${txt('q10','10. What new drinks, desserts or dishes would you like us to introduce?','e.g. a new latte or waffle flavour')}
  ${opt('q11','11. How often do you usually visit?',['First visit','Weekly','A few times a month','Monthly','Occasionally'])}
  ${txt('q12','12. Any additional comments?','Optional')}
  <div class="ferr" id="svErr"></div><button class="cta" data-act="svSend" ${done<4?'disabled':''}>${ic('send')}Send & unlock ${DB.feedback.pct}% off</button>
  <p class="note center">Your answers go privately to the Allure team. We never post them as public reviews.</p></div></div>`},

 /* ---------- REFER ---------- */
 s_refer(c){const R=DB.referral;if(!c)return `<div class="screen"><div class="sec"><div class="thanks"><div class="big">${ic('users')}</div><h2 style="font-family:var(--disp);color:var(--g8);margin:4px 0">Refer a friend</h2><p class="mut">${esc(R.terms)}</p></div><button class="cta" data-act="auth" data-v="signup">Join to get your code</button></div></div>`;

 /* ---------- EVENT ---------- */

 t_epos(){return `<div class="acard"><h3>EPOS connection <span class="badge">Not connected</span></h3><p class="note">The café keeps taking payments on its existing Epos till. Staff use Allure Club terminal (this browser app on any Android tablet) to add stamps and check vouchers. No EPOS integration is live.</p>
  <p class="note">When an EPOS can call external services, it can use the same backend endpoints the terminal uses. Every call needs a staff or device credential, and a unique transaction ID so a retried request is never processed twice.</p></div>
  <div class="acard"><h3>API endpoints (Cloud Functions, europe-west2)</h3><pre class="api">POST staffLookup     { scan }                       → member summary or voucher status
POST awardStamps     { memberToken, qty, txnId, receiptRef? }
                                                    → { added, multiplier, balance, rewardsIssued[] }
POST verifyVoucher   { code }                       → { status: valid|used|expired|revoked|unknown, … }
POST redeemVoucher   { code, txnId, receiptRef? }   → { redeemed: true }   (atomic, once only)
POST recordQualifyingTransaction                    (EPOS line items → qualifying drink count)
     { memberToken, txnId, lines:[{sku, qty}] }

Scan formats   Member QR  TEC1.M.&lt;token&gt;    (random, revocable, no personal data)
               Voucher    TEC1.V.TE-XXXX-XXXX  or the Code 128 barcode TE-XXXX-XXXX
Idempotency    txnId must be unique per till transaction; repeats return the first result.</pre>
  <p class="note">Full documentation: backend/API.md in the project files.</p></div>`}
};

/* =====================================================================
   ALLURE: Spin & Win (one spin per member every Friday), welcome offer
   and the 4th-stamp upgrade. The prize is decided by the API (on the
   server when live: functions/src/index.js → spinWheel); the wheel only
   animates to the result it is given.
   ===================================================================== */
P.wheel='M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4';
DB.spin=DB.spin||JSON.parse(JSON.stringify(SPIN_SEED));DB.spins=DB.spins||{};DB.welcome=DB.welcome||{on:true,pct:15,expDays:30,terms:''};
function spinKey(t=Date.now()){const S=DB.spin;const d=new Date(t);if(S.test)return 'T'+ymd(d);return d.getDay()===+S.day?ymd(d):null}
function nextSpinAt(t=Date.now()){const S=DB.spin;const d=new Date(t);d.setHours(0,0,0,0);if(S.test){d.setDate(d.getDate()+1);return d.getTime()}let add=(+S.day-d.getDay()+7)%7;if(add===0)add=7;d.setDate(d.getDate()+add);return d.getTime()}
const endOfDay=(t=Date.now())=>{const d=new Date(t);d.setHours(24,0,0,0);return d.getTime()};
function cdText(ms){if(ms<=0)return 'now';const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;const p=n=>String(n).padStart(2,'0');return d?`${d}d ${h}h ${m}m`:`${p(h)}:${p(m)}:${p(x)}`}
function spinState(c){const key=spinKey();const mine=c?Object.values(DB.spins).filter(s=>s.cid===c.cid).sort((a,b)=>b.at-a.at):[];
 const cur=key&&c?DB.spins[c.cid+'_'+key]||null:null;const live=mine.find(s=>s.code&&DB.vouchers[s.code]&&vActive(DB.vouchers[s.code]))||null;
 return {key,cur,live,open:!!key&&!cur,next:nextSpinAt()}}
function wheelSegs(){const ps=DB.spin.prizes.filter(p=>+p.pct>0);const none=ps.find(p=>p.kind==='none');const win=ps.filter(p=>p.kind!=='none');const out=[];win.forEach(p=>{out.push(p);if(none)out.push(none)});return out.length?out:ps.slice(0,1)}
function wheelSVG(){const S=wheelSegs();const n=S.length,a=360/n,R=148,cx=160,cy=160;let g='',t='',dots='';
 const pt=(ang,r)=>{const rad=(ang-90)*Math.PI/180;return [cx+r*Math.cos(rad),cy+r*Math.sin(rad)]};
 S.forEach((p,i)=>{const [x1,y1]=pt(i*a,R),[x2,y2]=pt((i+1)*a,R);const win=p.kind!=='none';
  g+=`<path d="M${cx} ${cy}L${x1.toFixed(2)} ${y1.toFixed(2)}A${R} ${R} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z" fill="${win?'url(#wgold)':'#FFFFFF'}" stroke="#14141420" stroke-width="1"/>`;
  const mid=i*a+a/2;const [tx,ty]=pt(mid,R*.63);const lab=String(p.short||p.label);const rot=mid<=180?mid-90:mid+90;

 if(t.classList.contains('svt')){C.sv[t.dataset.k]=t.value;return}
 if(t.id==='aQ'){A.q=t.value;const pos=t.selectionStart;A.render();const n=$('#aQ');if(n){n.focus();n.setSelectionRange(pos,pos)}return}
 if(t.dataset.pd&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')&&t.type!=='datetime-local'){A.pd[t.dataset.pd]=t.value;const b=$('[data-act="aPush"]');if(b)b.disabled=!A.pd.title||!A.pd.body;return}
 if(t.id==='tIn'){T.err='';return}
 if(['bkN','bkP','bkD','bkT','bkX'].includes(t.id)){const a=$('#bkWa');if(a){const m=ACT.bookWa({id:a.dataset.id});if(m)a.href=waHref(m)}return}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='tPcOk'){T.pc.ok=t.checked;const bt=$('#tPaperBtn');if(bt)bt.disabled=!t.checked||(T.pc.count||0)<1;return}
 if(t.dataset.pd){A.pd[t.dataset.pd]=t.value;if(t.tagName==='SELECT'||t.type==='datetime-local'){A._keep=true;A.render()}return}
 if(t.dataset.pref){const c=member();if(!c)return;const k=t.dataset.pref;if(k==='rewards')c.notif.rewards=t.checked;else if(k==='events')c.notif.events=t.checked;else{c.consent[k]=t.checked;c.consent.at=Date.now();if(k==='push'){c.notif.offers=t.checked;c.notif.events=t.checked}}
  audit(null,'member.consent',`${shortName(c.name)} ${t.checked?'opted in to':'opted out of'} ${k==='email'?'email marketing':k==='push'?'offer notifications':k==='events'?'event notifications':'reward notifications'}`,{cid:c.cid});commit();C.render(true);C.toast('Preferences saved');return}
 if(t.dataset.elig!==undefined||t.dataset.bd!==undefined){t.closest('label').classList.toggle('on',t.checked);return}
 if(t.dataset.mav){const i=itemById(t.dataset.mav);i.avail=t.checked;audit(A.s,'settings.menu',`${i.name} marked ${i.avail?'available':'not available today'}`);commit();C.render(true);A.toast(i.name+(i.avail?' available':' not available today'));return}
 if(t.dataset.mhid){const i=itemById(t.dataset.mhid);i.hidden=!t.checked;audit(A.s,'settings.menu',`${i.name} ${i.hidden?'hidden':'shown'}`);commit();C.render(true);A.toast(i.name+(i.hidden?' hidden':' shown'));return}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const t=e.target;if(t.id==='tIn'){e.preventDefault();ACT.tManual();return}if(t.id==='aPin'){e.preventDefault();ACT.aLogin();return}if(t.id==='vQ'){e.preventDefault();ACT.aVLook();return}}});
/* USB / Bluetooth barcode scanners type the code quickly and press Enter */
let KB='',KBT=0;document.addEventListener('keydown',e=>{const t=e.target;if(t&&/INPUT|TEXTAREA|SELECT/.test(t.tagName))return;const now=Date.now();if(now-KBT>80)KB='';KBT=now;
 if(e.key==='Enter'){const code=KB;KB='';if(T.s&&parseScan(code)){e.preventDefault();if(!['scan','member','voucher','done','vdone','home'].includes(T.view))return;T.onScan(code)}return}if(e.key.length===1)KB+=e.key});
$('#cPush').addEventListener('click',()=>{const l=$('#cPush').dataset.link;$('#cPush').classList.remove('show');C.follow(l)});
$('#term').addEventListener('pointerdown',()=>{T.last=Date.now()});
$('#cScroll').addEventListener('scroll',e=>{const car=$('#evCar');if(car&&!car._b){car._b=1;car.addEventListener('scroll',()=>{const w=car.firstElementChild.offsetWidth+12;const i=Math.round(car.scrollLeft/w);$$('#evDots i').forEach((d,j)=>d.classList.toggle('on',j===i))})}
 if(C.screen==='menu'){const y=$('#cScroll').scrollTop+70;let cur=null;$$('#cScroll .msec').forEach(s=>{if(s.offsetTop<=y)cur=s.dataset.cat});if(cur&&cur!==C._spy){C._spy=cur;$$('#mChips .chip').forEach(c=>{const on=c.dataset.id===cur;c.classList.toggle('on',on);if(on){const ch=$('#mChips');ch.scrollLeft=c.offsetLeft-ch.clientWidth/2+c.offsetWidth/2}})}}},{passive:true});

/* ---------- uploads + photo scanning ---------- */
function fileToData(file,max=900){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
$('#fileIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=await fileToData(f,A.upT==='evMenu'?1200:900);
 if(A.upT==='evHero'){A.ed.hero=d;A.eventModal(null,A.ed)}else if(A.upT==='evMenu'){A.ed.menuImg=d;A.eventModal(null,A.ed)}else if(A.upT==='news'){A.nd.img=d;A.newsModal(null,A.nd)}else if(A.upT==='item'){A.it.photo=d;A.itemModal(null,A.it)}}catch(err){A.toast('Couldn’t read that image','alert')}});
$('#cardIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=await fileToData(f,1400);T.paperPhoto(d)}catch(err){T.err='Couldn’t read that photo. Try again.';T.render()}});
$('#scanIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const code=await decodeQR(f);if(code)T.onScan(code);else{T.err='No QR code or barcode found in that photo.';T.render()}});

/* ---------- background jobs (Cloud Scheduler when live) ---------- */
setInterval(()=>{let ch=false;DB.pushes.filter(p=>p.status==='scheduled'&&p.sendAt<=Date.now()).forEach(p=>{const s=staffById(p.by);if(s){try{API.sendPush({id:s.id,role:s.role},p);ch=true}catch(e){p.status='failed'}}});
 if(T.s&&Date.now()-T.last>15*60e3){T.s=null;T.go('login')}if(ch&&A.tab==='notify')A.render()},15000);
window.addEventListener('storage',e=>{if(e.key!==LS||!e.newValue)return;try{DB=JSON.parse(e.newValue)}catch(x){return}C.render(true);if(!['scan'].includes(T.view))T.render();A._keep=true;A.render()});

(function boot(){if(!ME.did){ME.did='d'+rid(10);saveMe()}
 try{const r=new URLSearchParams(location.search).get('ref');if(r){ME.refIn=r.toUpperCase().slice(0,12);saveMe()}}catch(e){}
 const route=()=>{const h=location.hash.replace('#','');document.body.classList.remove('only','only-app','only-terminal','only-admin');if(['app','terminal','admin'].includes(h)){document.body.classList.add('only','only-'+h)}};route();window.addEventListener('hashchange',()=>{route();T.render()});
 document.body.classList.add('v-'+(ME.view||'terminal'),'m-'+(ME.mview||'phone'));$$('#switch button').forEach(b=>b.classList.toggle('on',b.dataset.v===(window.innerWidth<=1100?(ME.mview||'phone'):(ME.view||'terminal'))));
 C.render();T.render();A.render();if(ME.refIn&&!member())setTimeout(()=>C.authSheet('signup'),400)})();
