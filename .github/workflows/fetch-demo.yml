name: Fetch demo app files
on:
  workflow_dispatch:
    inputs:
      slug:
        description: Demo slug (e.g. smash-n-wings)
        required: true
      paths:
        description: Space-separated file paths inside the app (default index.html)
        required: false
        default: index.html
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Download through an admin session
        env:
          PIN: ${{ secrets.ADMIN_PIN || '1275' }}
          SLUG: ${{ inputs.slug }}
          PATHS: ${{ inputs.paths }}
        run: |
          H=https://smrgraphics.co.uk; A=$H/demo-admin/api.php
          curl -sf -c c.txt -b c.txt -H "Origin: $H" -H 'Content-Type: application/json' -d "{\"pin\":\"$PIN\"}" "$A?a=login" > /dev/null
          mkdir -p out
          for p in $PATHS; do mkdir -p "out/$(dirname "$p")"; curl -sf -b c.txt -o "out/$p" "$H/demo/run/$SLUG/$p"; ls -la "out/$p"; done
      - name: Push the files to a scratch branch (not deployed)
        env:
          SLUG: ${{ inputs.slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && git init -q && git checkout -q -b "fetched/$SLUG"
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "Fetched $SLUG"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "fetched/$SLUG"
