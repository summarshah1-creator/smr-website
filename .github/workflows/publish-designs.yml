name: Publish designs

# Other Claude chats (or anyone with repo access) send finished designs to a client by pushing a branch
# named designs/<anything> that holds a folder designs-inbox/ with the pictures (+ optional manifest.json).
# The folder is uploaded to the server's inbox, imported as a 14-day designs link, and the link is written
# back to the branch as designs-inbox/RESULT.json (and shown in the run summary).
on:
  push:
    branches: ['designs/**']
    paths: ['designs-inbox/**', '!designs-inbox/RESULT.json']
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch with the designs-inbox folder'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
      - name: Check the folder
        id: job
        run: |
          test -d designs-inbox || { echo "No designs-inbox folder on this branch"; exit 1; }
          rm -f designs-inbox/RESULT.json
          n=$(find designs-inbox -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' \) | wc -l)
          echo "pictures: $n"; test "$n" -gt 0
          echo "id=$(python3 -c 'import secrets;print(secrets.token_urlsafe(12))')" >> "$GITHUB_OUTPUT"
      - name: Upload to the server inbox
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./designs-inbox/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './public_html/' }}demo-data/inbox/${{ steps.job.outputs.id }}/
      - name: Write the link
        run: |
          url="https://smrgraphics.co.uk/d/${{ steps.job.outputs.id }}"
          # Ask the server to import now (the host's bot check may block this; then it imports when the link is first opened
          # or when SMR Admin opens the Designs tab).
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" \
            -X POST "https://smrgraphics.co.uk/designs/api.php?a=import&job=${{ steps.job.outputs.id }}" -o import.txt -w "HTTP %{http_code}\n" || true
          head -c 300 import.txt; echo
          printf '{"ok":true,"url":"%s","expires_days":14,"published":"%s"}\n' "$url" "$(date -u +%FT%TZ)" > designs-inbox/RESULT.json
          echo "### Designs link ready" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add designs-inbox/RESULT.json
          git commit -m "Designs link: $url"
          git push origin HEAD:${{ inputs.branch || github.ref_name }}
