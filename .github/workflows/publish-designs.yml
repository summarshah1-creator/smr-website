name: Publish designs

# Other Claude chats (or anyone with repo access) send finished designs to a client by pushing a branch
# named designs/<anything> that holds a folder designs-inbox/ with the pictures (+ optional manifest.json).
# The folder is uploaded to the server's inbox, imported as a 14-day designs link, and the link is written
# back to the branch as designs-inbox/RESULT.json (and shown in the run summary).
on:
  push:
    branches: ['designs/**']
    paths: ['designs-inbox/**', '!designs-inbox/RESULT.json']
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch with the designs-inbox folder'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
      - name: Check the folder
        id: job
        run: |
          test -d designs-inbox || { echo "No designs-inbox folder on this branch"; exit 1; }
          rm -f designs-inbox/RESULT.json
          n=$(find designs-inbox -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' \) | wc -l)
          echo "pictures: $n"; test "$n" -gt 0
          echo "id=$(openssl rand -hex 16)" >> "$GITHUB_OUTPUT"
      - name: Upload to the server inbox
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./designs-inbox/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './public_html/' }}demo-data/inbox/${{ steps.job.outputs.id }}/
      - name: Import and get the link
        run: |
          curl -sS -X POST "https://smrgraphics.co.uk/designs/api.php?a=import&job=${{ steps.job.outputs.id }}" -o result.json -w "HTTP %{http_code}\n"
          cat result.json; echo
          grep -q '"ok":true' result.json
          url=$(python3 -c "import json;print(json.load(open('result.json'))['url'])")
          echo "### Designs link ready" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          cp result.json designs-inbox/RESULT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add designs-inbox/RESULT.json
          git commit -m "Designs link: $url"
          git push origin HEAD:${{ inputs.branch || github.ref_name }}
