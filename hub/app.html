<style>html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}*{touch-action:manipulation}</style>
<script>/* no zoom on phones (owner rule): pinch, double-tap, ctrl+wheel, ctrl +/- */
(function(){var d=document;['gesturestart','gesturechange','gestureend'].forEach(function(e){d.addEventListener(e,function(ev){ev.preventDefault()},{passive:false})});
d.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
var last=0;d.addEventListener('touchend',function(e){var n=Date.now();if(n-last<320&&!(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]')))e.preventDefault();last=n},{passive:false});
addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});
addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&/^(=|\+|-|_|0)$/.test(e.key))e.preventDefault()});})();</script>
