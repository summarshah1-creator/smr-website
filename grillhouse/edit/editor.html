*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:#fff;font-family:Montserrat,system-ui,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(120% 60% at 50% 0%,#2c3517 0%,#171c0b 55%,#0f120a 100%) fixed;min-height:100vh;padding-bottom:110px}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
/* top bar */
#top{position:sticky;top:0;z-index:20;background:rgba(17,21,9,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.tb{display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.brand svg{width:96px;height:auto;display:block}
.brand small{font:600 10px/1 Montserrat;letter-spacing:.18em;text-transform:uppercase;color:var(--g2)}
.tbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;padding:7px 6px 6px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);font:600 10.5px/1 Montserrat;letter-spacing:.02em}
.tbtn svg{width:20px;height:20px}
.tbtn:disabled{opacity:.35}
.tbtn .bd{position:absolute;top:-6px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font:700 11px/19px Montserrat;text-align:center;box-shadow:0 0 0 2px #111509}
.tbtn.u .bd{background:var(--g2);color:#1a160b}
.tbtn.sv{background:rgba(214,183,135,.12);color:var(--g1)}
.tbtn.sv.dirty{background:var(--gold);color:#1c1709;border-color:transparent;box-shadow:0 0 0 0 rgba(214,183,135,.6);animation:pu 2s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(214,183,135,.55)}70%{box-shadow:0 0 0 9px rgba(214,183,135,0)}100%{box-shadow:0 0 0 0 rgba(214,183,135,0)}}
.fbcta{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px;border-radius:13px;background:rgba(214,183,135,.16);border:1px solid rgba(214,183,135,.4);text-align:left}
.fbcta svg{flex:none;width:38px;height:38px;padding:9px;border-radius:50%;background:var(--gold);color:#1c1709}
.fbcta b{display:block;font-size:14.5px;color:var(--g1)}.fbcta small{display:block;font:500 12px/1.35 Montserrat;color:var(--cream);margin-top:2px}
.big.rec{background:rgba(224,82,63,.16);border:1px solid rgba(224,82,63,.45);color:#ffb3a7}
.big.rec.on{background:var(--red);color:#fff;animation:pr 1.2s infinite}

<script>var PEN="<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z\"/><path d=\"M13.5 6.5l4 4\"/></svg>",XX="<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.6\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg>",UNDO="<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 14L4 9l5-5\"/><path d=\"M4 9h10.5a5.5 5.5 0 0 1 0 11H11\"/></svg>",BIN="<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3\"/></svg>",WAI="<svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.5-.3z\"/></svg>",MIC="<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/><path d=\"M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21\"/></svg>",NOTE="<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h14v12H9l-4 4z\"/><path d=\"M9 9h6M9 12h4\"/></svg>";(function(){
var ORIG = JSON.parse(document.getElementById('menu-data').textContent);
var KEY = 'gh-menu-editor-v1';
var WA = '447931814538';
var st, undo = [];
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function fresh(){ return { sections: clone(ORIG), deleted: [], added: 0, notes: [] }; }
var base = '', dirty = false, saving = false;
function load(){
  try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.st && s.st.sections) { st = s.st; undo = s.undo || []; base = s.base || ''; dirty = !!s.dirty; if (!st.notes) st.notes = []; return; } } catch(e){}
  st = fresh(); undo = [];
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({ st: st, undo: undo.slice(-60), base: base, dirty: dirty })); } catch(e){ try { localStorage.setItem(KEY, JSON.stringify({ st: Object.assign({}, st, { notes: st.notes.filter(function(n){ return !n.audio; }) }), undo: [], base: base, dirty: dirty })); } catch(e2){} } }
load();

var $ = function(s, r){ return (r || document).querySelector(s); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var origById = {};
ORIG.forEach(function(s){ s.items.forEach(function(it){ origById[it.id] = it; }); });

function act(label, fn){
  undo.push({ label: label, snap: clone(st) });
  if (undo.length > 80) undo.shift();
  fn(); dirty = true; save(); render(); toast(label, true);
}
function doUndo(){
  if (!undo.length) return;
  var u = undo.pop(); st = u.snap; dirty = true; save(); render(); toast('Undone: ' + u.label);
}

/* ---------- price helpers ---------- */
function fmtPart(v){
  v = String(v).replace(/[£\s]/g, '');
  if (v === '') return '';
  var n = parseFloat(v);
  if (isNaN(n)) return null;
  return '£' + n.toFixed(2);
}
function fmtPrice(v){
  var parts = String(v).split('/').map(function(p){ return fmtPart(p); });
  if (parts.some(function(p){ return p === null || p === ''; })) return null;
  return parts.join(' / ');
}
function bare(p){ return String(p || '').replace(/£/g, ''); }

/* ---------- render ---------- */
function find(id){
  for (var i = 0; i < st.sections.length; i++){
    var s = st.sections[i];
    for (var j = 0; j < s.items.length; j++) if (s.items[j].id === id) return { s: s, i: j, it: s.items[j] };
  }
}
function changedFlags(it){
  var o = origById[it.id];
  if (!o) return { added: true };
  return { name: o.name !== it.name, price: o.price !== it.price, desc: (o.desc || '') !== (it.desc || '') };
}
function render(){
  var html = '';
  st.sections.forEach(function(s){
    html += '<section class="sec" id="' + s.id + '"><div class="sh"><h2>' + esc(s.title) + '</h2>' + (s.note ? '<div class="note">' + esc(s.note) + '</div>' : '') + '</div><div class="items">';
    if (!s.items.length) html += '<div class="empty">No dishes here right now.</div>';
    s.items.forEach(function(it){
      var c = changedFlags(it), tag = '';
      if (c.added) tag = '<span class="tag new">New</span>';
      else if (c.price || c.name || c.desc) tag = '<span class="tag">' + (c.price ? 'Price changed' : 'Edited') + '</span>';
      html += '<div class="it" data-id="' + it.id + '"><div class="txt"><div class="r1"><span class="n">' + esc(it.name) + '</span>' + tag + '</div>' +
        (it.desc ? '<div class="d">' + esc(it.desc) + '</div>' : '') + '</div>' +
        '<div class="p">' + esc(it.price) + '</div>' +
        '<div class="btns"><button class="ib ed" data-ed="' + it.id + '" aria-label="Edit ' + esc(it.name) + '">' + PEN + '</button>' +
        '<button class="ib rm" data-rm="' + it.id + '" aria-label="Remove ' + esc(it.name) + '">' + XX + '</button></div></div>';
    });
    html += '<button class="add" data-add="' + s.id + '">+ Add a dish to ' + esc(s.title) + '</button></div></section>';
  });
  $('#list').innerHTML = html;
  var ub = $('#undoBtn'); ub.disabled = !undo.length; $('#undoN').textContent = undo.length; $('#undoN').style.display = undo.length ? '' : 'none';
  var dn = st.deleted.length; $('#delN').textContent = dn; $('#delN').style.display = dn ? '' : 'none';
  var fn = st.notes.length; $('#fbN').textContent = fn; $('#fbN').style.display = fn ? '' : 'none';
  $('#saveBtn').classList.toggle('dirty', dirty); $('#saveL').textContent = dirty ? 'Save' : 'Saved';
  chips();
}
function chips(){
  var c = $('#chips'); if (c.dataset.done) return; c.dataset.done = 1;
  c.innerHTML = st.sections.map(function(s){ return '<button data-go="' + s.id + '">' + esc(s.title) + '</button>'; }).join('');
}

/* ---------- sheets ---------- */
var sheet = $('#sheet'), sbody = $('#sbody');
function open(html, cls){
  sbody.innerHTML = html; sheet.className = 'sheet on ' + (cls || '');
  document.body.classList.add('lock');
  var f = sbody.querySelector('[autofocus]'); if (f && !('ontouchstart' in window)) setTimeout(function(){ f.focus(); }, 250);
}
function close(){ if (R.on) stopRec(); sheet.className = 'sheet'; document.body.classList.remove('lock'); }
sheet.addEventListener('click', function(e){ if (e.target === sheet) close(); });

function askRemove(id){
  var f = find(id); if (!f) return;
  open('<div class="ico warn">' + XX + '</div><h3>Remove ' + esc(f.it.name) + '?</h3><p>It comes off the menu. You can put it back any time from <b>Deleted</b> at the top.</p>' +
    '<button class="big red" id="yesRm">Yes, remove it</button><button class="big ghost" data-close>No, keep it</button>');
  $('#yesRm').onclick = function(){
    close();
    act('Removed ' + f.it.name, function(){
      var g = find(id); g.s.items.splice(g.i, 1);
      st.deleted.unshift({ item: g.it, sid: g.s.id, stitle: g.s.title, idx: g.i, when: Date.now() });
    });
  };
}
function editSheet(id, sid){
  var f = id ? find(id) : null, it = f ? f.it : { name: '', price: '', desc: '' };
  var o = id ? origById[id] : null;
  var sec = f ? f.s : st.sections.filter(function(s){ return s.id === sid; })[0];
  var was = function(k){ return o && o[k] !== it[k] && (o[k] || it[k]) ? '<div class="was">Was: ' + esc(o[k] || '(none)') + '</div>' : ''; };
  open('<div class="shead"><small>' + esc(sec.title) + '</small><h3>' + (f ? 'Edit dish' : 'Add a dish') + '</h3></div>' +
    '<label>Dish name<input id="fName" value="' + esc(it.name) + '" placeholder="e.g. Lamb Tikka" autocomplete="off"></label>' + was('name') +
    '<label>Price<div class="pfield"><span>£</span><input id="fPrice" value="' + esc(bare(it.price)) + '" inputmode="decimal" placeholder="8.95" autocomplete="off"' + (f ? ' autofocus' : '') + '></div></label>' + was('price') +
    (/\//.test(it.price) ? '<div class="hint">Half / Full price: keep the / between the two prices.</div>' : '') +
    '<label>Description <em>(optional)</em><textarea id="fDesc" rows="3" placeholder="What comes with it">' + esc(it.desc) + '</textarea></label>' + was('desc') +
    '<div class="err" id="fErr"></div>' +
    '<button class="big gold" id="fSave">' + (f ? 'Save changes' : 'Add to menu') + '</button><button class="big ghost" data-close>Cancel</button>' +
    (o ? '<button class="link" id="fReset">Put back how it was</button>' : ''));
  var r = $('#fReset');
  if (r){ if (o.name === it.name && o.price === it.price && (o.desc || '') === (it.desc || '')) r.remove(); else r.onclick = function(){
    close(); act('Reset ' + it.name, function(){ var g = find(id); g.s.items[g.i] = clone(o); });
  }; }
  $('#fSave').onclick = function(){
    var n = $('#fName').value.trim(), p = fmtPrice($('#fPrice').value), d = $('#fDesc').value.trim();
    if (!n) return err('Please type the dish name.');
    if (!p) return err('Please type a price, like 8.95');
    if (f && n === it.name && p === it.price && d === (it.desc || '')) return close();
    close();
    if (f){
      var what = p !== it.price ? 'Changed ' + n + ' to ' + p : 'Edited ' + n;
      act(what, function(){ var g = find(id); g.it.name = n; g.it.price = p; g.it.desc = d; });
    } else {
      act('Added ' + n, function(){
        st.added = (st.added || 0) + 1;
        sec = st.sections.filter(function(s){ return s.id === sid; })[0];
        sec.items.push({ id: 'new' + Date.now(), name: n, price: p, desc: d });
      });
    }
  };
  function err(m){ $('#fErr').textContent = m; }
}
function deletedSheet(){
  var h = '<div class="shead"><h3>Deleted dishes</h3><small>Tap <b>Put back</b> to return a dish to the menu</small></div>';
  if (!st.deleted.length) h += '<div class="empty big">Nothing deleted. Anything you remove will show here.</div>';
  else h += '<div class="dl">' + st.deleted.map(function(d, i){
    return '<div class="drow"><div><div class="n">' + esc(d.item.name) + ' <span class="p">' + esc(d.item.price) + '</span></div><div class="from">' + esc(d.stitle) + ' · ' + ago(d.when) + '</div></div><button class="pb" data-pb="' + i + '">Put back</button></div>';
  }).join('') + '</div>';
  h += '<button class="big ghost" data-close>Close</button>';
  open(h, 'tall');
}
function restore(i){
  var d = st.deleted[i]; if (!d) return;
  act('Put back ' + d.item.name, function(){
    var s = st.sections.filter(function(x){ return x.id === d.sid; })[0];
    s.items.splice(Math.min(d.idx, s.items.length), 0, d.item);
    st.deleted.splice(i, 1);
  });
  setTimeout(function(){ var el = document.querySelector('[data-id="' + d.item.id + '"]'); if (el){ el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.classList.add('flash'); } }, 60);
}
function ago(t){
  var m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  var h = Math.round(m / 60); if (h < 24) return h + ' hr ago';
  return new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function historySheet(){
  var h = '<div class="shead"><h3>Undo</h3><small>Your changes, newest first. Undo goes back one step at a time.</small></div>';
  if (!undo.length) h += '<div class="empty big">No changes yet.</div>';
  else h += '<div class="dl">' + undo.slice().reverse().map(function(u, i){ return '<div class="drow"><div class="n sm">' + esc(u.label) + '</div>' + (i === 0 ? '<button class="pb" id="undo1">Undo</button>' : '') + '</div>'; }).join('') + '</div>';
  h += '<button class="big ghost" data-close>Close</button>';
  open(h, 'tall');
  var b = $('#undo1'); if (b) b.onclick = function(){ close(); doUndo(); };
}

/* ---------- changes summary ---------- */
function changes(){
  var out = [], now = {};
  st.sections.forEach(function(s){ s.items.forEach(function(it){
    now[it.id] = 1; var o = origById[it.id];
    if (!o) { out.push('➕ ' + s.title + ': ' + it.name + ' ' + it.price + (it.desc ? ' (' + it.desc + ')' : '')); return; }
    if (o.name !== it.name) out.push('✏️ Renamed ' + o.name + ' → ' + it.name);
    if (o.price !== it.price) out.push('💷 ' + it.name + ': ' + o.price + ' → ' + it.price);
    if ((o.desc || '') !== (it.desc || '')) out.push('📝 ' + it.name + ' description: ' + (it.desc || '(removed)'));
  }); });
  ORIG.forEach(function(s){ s.items.forEach(function(o){ if (!now[o.id]) out.push('❌ Remove ' + o.name + ' (' + s.title + ')'); }); });
  return out;
}
function sendSheet(){
  var c = changes();
  var tn = st.notes.filter(function(n){ return n.text; }).map(function(n){ return '💬 ' + n.text; });
  var vn = st.notes.filter(function(n){ return n.audio; }).length;
  c = c.concat(tn);
  if (vn) c.push('🎤 ' + vn + ' voice note' + (vn > 1 ? 's' : '') + ' (saved with the menu)');
  if (!c.length) return toast('No changes to send yet');
  open('<div class="shead"><h3>Send your changes</h3><small>' + c.length + ' change' + (c.length > 1 ? 's' : '') + ' · these go to SMR on WhatsApp</small></div><div class="dl sum">' +
    c.map(function(x){ return '<div class="drow"><div class="n sm">' + esc(x) + '</div></div>'; }).join('') + '</div>' +
    '<a class="big green" id="goWa" target="_blank" rel="noopener" href="https://wa.me/' + WA + '?text=' + encodeURIComponent('Hi SMR 👋 Grill House menu changes:\n\n' + c.join('\n')) + '">' + WAI + 'Send on WhatsApp</a><button class="big ghost" data-close>Not yet</button>', 'tall');
}
/* ---------- save / versions ---------- */
function doSave(){
  if (saving) return;
  if (!dirty) return toast('Everything is saved ✓');
  saving = true; $('#saveL').textContent = 'Saving…';
  var c = changes(), tn = st.notes.filter(function(n){ return n.text; }).length, vn = st.notes.filter(function(n){ return n.audio; }).length;
  fetch('api.php?a=save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ st: st, base: base, lines: c, notes: tn, voice: vn }) })
    .then(function(r){ return r.json(); })
    .then(function(d){
      saving = false;
      if (!d || !d.ok) throw 0;
      st = d.st; base = d.ver; dirty = false; save(); render();
      toast('Saved ✓ SMR has your changes');
    })
    .catch(function(){ saving = false; render(); toast('Could not save. Check your internet and press Save again.'); });
}
function sync(){
  fetch('api.php?a=load', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(d){
    if (!d || !d.ok || !d.ver || !d.st) return;
    if (d.ver === base || dirty) return;   // unsaved edits on this phone stay until he saves
    st = d.st; if (!st.notes) st.notes = []; base = d.ver; dirty = false; undo = []; save(); render();
  }).catch(function(){});
}

/* ---------- feedback + voice notes ---------- */
var R = { on: false };
function fmtT(s){ s = Math.round(s); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
function notesHtml(){
  if (!st.notes.length) return '<div class="empty big">No feedback yet.</div>';
  return '<div class="dl">' + st.notes.slice().reverse().map(function(n){
    var body = n.audio ? '<div class="vn"><span class="vtag">' + MIC + 'Voice note · ' + fmtT(n.len || 0) + '</span><audio controls preload="metadata" src="' + n.audio + '"></audio></div>' : '<div class="n sm">' + esc(n.text) + '</div>';
    return '<div class="drow note"><div>' + body + '<div class="from">' + ago(n.t) + '</div></div><button class="ib rm" data-nd="' + n.id + '" aria-label="Delete">' + XX + '</button></div>';
  }).join('') + '</div>';
}
function feedbackSheet(){
  open('<div class="shead"><h3>Feedback</h3><small>Anything else you want changing on the menu? Type it or record a voice note. Add as many as you like.</small></div>' +
    '<label>Write a note<textarea id="noteT" rows="3" placeholder="e.g. Can we add a mixed grill for 2?"></textarea></label>' +
    '<button class="big gold" id="noteAdd">Add note</button>' +
    '<button class="big rec" id="recBtn">' + MIC + '<span id="recL">Record a voice note</span></button><div class="err" id="recErr"></div>' +
    '<div class="shead sub"><small>Your feedback</small></div><div id="notes">' + notesHtml() + '</div>' +
    '<button class="big ghost" data-close>Done</button>', 'tall');
}
function refreshNotes(){ var n = $('#notes'); if (n) n.innerHTML = notesHtml(); render(); }
function addNote(){
  var v = $('#noteT').value.trim(); if (!v) return;
  st.notes.push({ id: 'n' + Date.now(), t: Date.now(), text: v });
  $('#noteT').value = ''; dirty = true; save(); refreshNotes(); toast('Note added');
}
function delNote(id){
  var row = document.querySelector('[data-nd="' + id + '"]');
  if (row && !row.classList.contains('sure')){ row.classList.add('sure'); row.innerHTML = 'Delete?'; setTimeout(function(){ if (row.isConnected){ row.classList.remove('sure'); row.innerHTML = XX; } }, 3000); return; }
  st.notes = st.notes.filter(function(n){ return n.id !== id; }); dirty = true; save(); refreshNotes();
}
function rec(){ if (R.on) return stopRec(); startRec(); }
function startRec(){
  var e = $('#recErr'); e.textContent = '';
  if (!navigator.mediaDevices || !window.MediaRecorder){ e.textContent = 'Voice notes are not available in this browser. You can type a note instead.'; return; }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
    var type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].filter(function(t){ return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t); })[0];
    var mr = new MediaRecorder(stream, type ? { mimeType: type } : undefined), parts = [];
    R = { on: true, mr: mr, stream: stream, t0: Date.now() };
    mr.ondataavailable = function(ev){ if (ev.data.size) parts.push(ev.data); };
    mr.onstop = function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      var len = (Date.now() - R.t0) / 1000, blob = new Blob(parts, { type: mr.mimeType || 'audio/webm' });
      if (len < 0.7) return;
      var fr = new FileReader();
      fr.onload = function(){ st.notes.push({ id: 'v' + Date.now(), t: Date.now(), audio: fr.result, len: len }); dirty = true; save(); refreshNotes(); toast('Voice note added'); };
      fr.readAsDataURL(blob);
    };
    mr.start();
    var b = $('#recBtn'); b.classList.add('on');
    R.tick = setInterval(function(){ var l = $('#recL'); if (l) l.textContent = 'Recording ' + fmtT((Date.now() - R.t0) / 1000) + ' · tap to stop'; if (Date.now() - R.t0 > 300000) stopRec(); }, 250);
  }).catch(function(){ e.textContent = 'The microphone is blocked. Allow microphone access for this page, or type a note instead.'; });
}
function stopRec(){
  if (!R.on) return; R.on = false; clearInterval(R.tick);
  try { R.mr.stop(); } catch(e){}
  var b = $('#recBtn'); if (b){ b.classList.remove('on'); $('#recL').textContent = 'Record another voice note'; }
}


/* ---------- toast ---------- */
var tt;
function toast(m, withUndo){
  var t = $('#toast');
  t.innerHTML = '<span>' + esc(m) + '</span>' + (withUndo ? '<button id="tUndo">Undo</button>' : '');
  t.classList.add('on'); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('on'); }, 4200);
  var b = $('#tUndo'); if (b) b.onclick = function(){ t.classList.remove('on'); doUndo(); };
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('button'); if (!t) return;
  if (t.hasAttribute('data-close')) return close();
  if (t.dataset.rm) return askRemove(t.dataset.rm);
  if (t.dataset.ed) return editSheet(t.dataset.ed);
  if (t.dataset.add) return editSheet(null, t.dataset.add);
  if (t.dataset.pb != null) { close(); return restore(+t.dataset.pb); }
  if (t.dataset.go){ var el = document.getElementById(t.dataset.go); window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - $('#top').offsetHeight - 6, behavior: 'smooth' }); return; }
  if (t.id === 'undoBtn') return doUndo();
  if (t.id === 'histBtn') return historySheet();
  if (t.id === 'delBtn') return deletedSheet();
  if (t.id === 'fbBtn' || t.id === 'fbBtn2') return feedbackSheet();
  if (t.id === 'saveBtn') return doSave();
  if (t.id === 'recBtn') return rec();
  if (t.id === 'noteAdd') return addNote();
  if (t.dataset.nd) return delNote(t.dataset.nd);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') close();
  if (e.key === 'Enter' && sheet.classList.contains('on') && e.target.tagName === 'INPUT'){ var s = $('#fSave'); if (s) s.click(); }
});

/* highlight the chip for the section in view */
var chipsEl = $('#chips'), lastCur;
function spy(){
  var y = $('#top').offsetHeight + 20, cur = null;
  st.sections.forEach(function(s){ var el = document.getElementById(s.id); if (el && el.getBoundingClientRect().top <= y) cur = s.id; });
  if (cur === lastCur) return; lastCur = cur;
  chipsEl.querySelectorAll('button').forEach(function(b){
    var on = b.dataset.go === cur; b.classList.toggle('on', on);
    if (on) chipsEl.scrollTo({ left: b.offsetLeft - 16, behavior: 'smooth' });
  });
}
addEventListener('scroll', function(){ requestAnimationFrame(spy); }, { passive: true });
render(); spy(); sync();
addEventListener('visibilitychange', function(){ if (!document.hidden && !dirty) sync(); });
})();
</script></body></html>
