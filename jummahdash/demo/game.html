<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120c26">
<title>Jummah Dash · An SMR Original</title>
<style>
@font-face{font-family:Silk;src:url(silk.woff2)}
@font-face{font-family:Silk;font-weight:700;src:url(silkb.woff2)}
@font-face{font-family:PS;src:url(ps2p.woff2)}
@font-face{font-family:Amiri;font-weight:700;src:url(amiri.woff2)}
html,body{margin:0;height:100%;background:#120c26;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;inset:0;pointer-events:none;font-family:PS,monospace;color:#fff}
.hud{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));font-size:20px;text-shadow:3px 3px 0 #160c28;display:none}
.hud .c{font-size:13px;margin-top:8px;color:#ffd75a;display:flex;align-items:center;gap:6px}
.hud .c i{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3b0,#e9b52b 55%,#a8761a);box-shadow:0 0 0 2px #6b4a12}
.top-r{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:flex;gap:8px;pointer-events:auto}
.btn{font-family:PS,monospace;border:0;border-radius:10px;padding:8px 10px;font-size:12px;background:rgba(18,12,38,.7);color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25) inset;cursor:pointer}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at center,rgba(14,8,32,.25),rgba(14,8,32,.75));pointer-events:auto}
.panel img.logo{width:min(62vw,620px);filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.bdg{width:min(34vw,280px);border-radius:40px}
.badge{font-size:11px;letter-spacing:3px;color:#ffd75a;background:#151226;border:3px solid #ffd75a;border-radius:30px;padding:8px 16px}
.badge b{color:#fff;font-family:Silk;font-weight:700;font-size:16px;letter-spacing:1px;margin:0 6px}
.big{font-size:clamp(14px,2.6vw,22px);color:#ffd75a;text-shadow:3px 3px 0 #160c28;animation:pulse 1s infinite}
.small{font-size:11px;color:#e8e4ff;opacity:.85;text-align:center;line-height:1.8}
@keyframes pulse{50%{opacity:.45}}
.card{background:rgba(18,12,38,.88);border:3px solid #ffd75a;border-radius:16px;padding:18px 26px;text-align:center;min-width:260px}
.card h2{margin:0 0 12px;font-size:16px;color:#ffd75a}
.row{display:flex;justify-content:space-between;gap:30px;font-size:13px;margin:8px 0}
.go{margin-top:14px;font-family:PS,monospace;font-size:14px;background:#2fbf4a;color:#fff;border:0;border-radius:12px;padding:14px 20px;box-shadow:0 5px 0 #1b7a2c;cursor:pointer}
.hide{display:none!important}
#rot{position:fixed;inset:0;background:#120c26;color:#fff;font-family:PS,monospace;font-size:13px;display:none;align-items:center;justify-content:center;text-align:center;line-height:2;padding:30px;z-index:9}
@media (orientation:portrait) and (max-width:820px){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
  <div class="hud" id="hud"><div id="dist">0m</div><div class="c"><i></i><span id="coins">0</span></div></div>
  <div class="top-r"><button class="btn" id="snd">🔊</button></div>
  <div class="panel" id="menu">
    <img class="bdg" src="art/badge.png" alt="An SMR Original">
    <img class="logo" src="art/logo.png" alt="Jummah Dash">
    <div class="big">TAP TO START</div>
    <div class="small">Hold to fly · let go to drop<br>Late for Jummah. Grab the £1 coins, dodge the sparks.</div>
  </div>
  <div class="panel hide" id="over">
    <div class="card">
      <h2 id="ovT">MISSED THE KHUTBAH!</h2>
      <div class="row"><span>Distance</span><span id="oD">0m</span></div>
      <div class="row"><span>£1 coins</span><span id="oC">0</span></div>
      <div class="row"><span>Best</span><span id="oB">0m</span></div>
      <button class="go" id="again">RUN AGAIN</button>
    </div>
  </div>
</div>
<div id="rot">Turn your phone sideways<br>to play Jummah Dash ↻</div>
<script src="landmarks.js?v=1795271176"></script>
<script src="vehicles.js?v=1795271176"></script>
<script src="game.js?v=1795271176"></script>
</body>
</html>
